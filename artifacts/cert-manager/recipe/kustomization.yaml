# The recipe: what render.sh turns into ../rendered/. Two upstream charts inflated by kustomize, and the plain
# manifests that belong with them. Nothing here reaches the cluster; Flux applies ../rendered/ (README.md).
#
# Placement is decision 027: everything on the control planes, the cert-manager webhook three replicas spread softly
# over them, the rest one. The start-up check is a Helm hook, a Job that cannot be re-run once rendered, and is off.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager
resources:
  - namespace.yaml
  - clusterissuer.yaml
  - nordhost-webhook/pki.yaml
  - nordhost-webhook/rbac.yaml
  - nordhost-webhook/deployment.yaml
  - nordhost-webhook/apiservice.yaml
  - nordhost-webhook/service.yaml
helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.20.3
    releaseName: cert-manager
    namespace: cert-manager
    includeCRDs: true
    skipTests: true
    kubeVersion: "1.34.0"
    valuesInline:
      crds:
        enabled: true
        keep: true
      startupapicheck:
        enabled: false
      config:
        enableGatewayAPI: true
      global:
        priorityClassName: system-cluster-critical
      nodeSelector:
        kubernetes.io/os: linux
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      webhook:
        replicaCount: 3
        nodeSelector:
          kubernetes.io/os: linux
          node-role.kubernetes.io/control-plane: ""
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/instance: cert-manager
                app.kubernetes.io/component: webhook
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
      cainjector:
        nodeSelector:
          kubernetes.io/os: linux
          node-role.kubernetes.io/control-plane: ""
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule
  - name: external-dns
    repo: https://kubernetes-sigs.github.io/external-dns
    version: 1.21.1
    releaseName: external-dns
    namespace: cert-manager
    includeCRDs: true
    skipTests: true
    kubeVersion: "1.34.0"
    valuesInline:
      priorityClassName: system-cluster-critical
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      sources:
        - service
        - gateway-httproute
      provider:
        name: webhook
        webhook:
          image:
            # Temporary image for early testing; to move to a permanent home.
            repository: docker.io/eskpil/nordhost-externaldns-webhook
            tag: latest
          env:
            - name: CONFIG
              value: /etc/nordhost/config.json
          extraVolumeMounts:
            - name: nordhost-config
              mountPath: /etc/nordhost
              readOnly: true
          # The chart gives the webhook container no securityContext, so it fails the restricted PodSecurity
          # profile (warned at every apply). The same shape as the chart's own external-dns container: a static Go
          # binary reading one mounted file needs nothing more.
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      # The DirectAdmin credentials Secret shared with nordhost-webhook, delivered encrypted next to rendered/.
      extraVolumes:
        - name: nordhost-config
          secret:
            secretName: nordhost-config
patches:
  # The CRDs carry every Certificate in the cluster. No Kustomization, this one or the one that applied them before,
  # may prune them: deleting a CRD deletes its objects.
  - target:
      kind: CustomResourceDefinition
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: unused
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
