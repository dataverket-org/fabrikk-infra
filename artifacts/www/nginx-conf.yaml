# nginx's configuration, rendered from this template at start (README.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: www-nginx
  namespace: www
data:
  default.conf.template: |
    # signal.dataverket.org: the Signal group link (README.md).
    server {
        listen 8080;
        server_name signal.dataverket.org;

        # Keep the quotes (README.md).
        location / {
            return 302 "${SIGNAL_GROUP_LINK}";
        }
    }

    # www.dataverket.org, and everything else, probes included (README.md).
    server {
        listen 8080 default_server;
        server_name www.dataverket.org;

        # nginx sees http on 8080 behind the Gateway; an absolute redirect (a directory without its slash) would send
        # the browser there. A relative Location keeps the scheme and the name it came with.
        absolute_redirect off;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # https only: the Gateway terminates TLS and redirects http (README.md).
        location / {
            root /usr/share/nginx/html;
            index index.html;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }
    }
