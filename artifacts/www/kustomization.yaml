apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  - ./www-secrets.enc.yaml
  - ./nginx-conf.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./httproute.yaml
# The website; the name carries a hash of the content, so a changed page rolls the Deployment (README.md).
configMapGenerator:
  - name: www-site
    namespace: www
    files:
      - ./site/index.html
