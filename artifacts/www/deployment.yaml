apiVersion: apps/v1
kind: Deployment
metadata:
  name: www
  namespace: www
spec:
  replicas: 2
  selector:
    matchLabels:
      app: www
  template:
    metadata:
      labels:
        app: www
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29.3-alpine@sha256:5aea7cc516b419e3526f47dd1531be31a56a046cfe44754d94f9383e13e2ee99
          ports:
            - name: http
              containerPort: 8080
          # Read once per container start; rotating the invite needs a rollout (README.md).
          envFrom:
            - secretRef:
                name: www-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: templates
              mountPath: /etc/nginx/templates
              readOnly: true
            # Writable paths on a read-only root filesystem.
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: templates
          configMap:
            name: www-nginx
        - name: conf
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # The website, an image of its own (site.sh), mounted read-only; the digest is written by site.sh.
        - name: site
          image:
            reference: registry.dataverket.org/platform/www-site@sha256:120f7b10ef88d68e341c4173d2d0bd93e6d53e40150866fcb7bbeb2e0986c859
            pullPolicy: IfNotPresent
