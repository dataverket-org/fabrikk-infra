apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zulip-postgres
  namespace: zulip
spec:
  # One instance on one Cinder volume (decision 018). No PodDisruptionBudget, so a drain moves it.
  instances: 1
  enablePDB: false
  # The CNPG image plus Zulip's search dictionaries; postgres-image.sh builds it and writes this line.
  imageName: registry.dataverket.org/platform/postgresql-zulip:18.4-system-trixie@sha256:7b6783bbd1ccc457ada03ad050953cd31c31f2fa11c1119fde172771ba7eabb4
  storage:
    storageClass: csi-cinder-sc-delete
    size: 10Gi
  postgresql:
    parameters:
      max_wal_size: 1GB
  # Archiving to the hov1 site (backup.yaml, backup/README.md); serverName is this cluster's own folder.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: hov1
        serverName: zulip-postgres-1
  # Bootstrap from the hov1 archive, read by CNPG only at creation; a rebuild moves serverName first
  # (decision 021, docs/storage.md). The database was made 2026-10-15 by initdb as Zulip's create-db.sql makes it:
  # UTF8, C.UTF-8, owned by zulip.
  bootstrap:
    recovery:
      source: hov1-archive
      database: zulip
      owner: zulip
  externalClusters:
    - name: hov1-archive
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: hov1
          serverName: zulip-postgres-1
