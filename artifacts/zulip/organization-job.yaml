# The organization, as organization/organization.json says, made so by organization/apply.py in a pod of Zulip's
# own image: app:init writes Zulip's settings from the env below, then manage.py shell runs the file. Created when the
# database holds no organization, matched when it does. The two ConfigMaps come from kustomization.yaml with a hash of
# their content in the name, so a change to the file, the code or the brand changes this Job's spec; the force
# annotation lets Flux recreate the Job then, which runs it again. A finished Job stays, so Flux has nothing to
# re-apply; a failed one fails the Kustomization, where it shows.
#
# The env is the StatefulSet's, verbatim: the same settings make the same Zulip. Change both or neither.
apiVersion: batch/v1
kind: Job
metadata:
  name: zulip-organization
  namespace: zulip
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: organization
          image: ghcr.io/zulip/zulip-server:12.3-0@sha256:76a1ecc4ba5470869d9609ef1ec16497b410189918b2daba85862183a59aa275
          command:
            - sh
            - -c
            - |
              /sbin/entrypoint.sh app:init &&
              exec /sbin/entrypoint.sh app:managepy shell -c 'exec(open("/organization/apply.py").read())'
          env:
            - name: SETTING_EXTERNAL_HOST
              value: forum.dataverket.org
            - name: SETTING_ZULIP_ADMINISTRATOR
              value: admin@dataverket.org
            - name: LOADBALANCER_IPS
              value: 10.244.0.0/16
            - name: AUTO_BACKUP_ENABLED
              value: "False"
            - name: SETTING_WEB_PUBLIC_STREAMS_ENABLED
              value: "True"
            - name: SETTING_REMOTE_POSTGRES_HOST
              value: zulip-postgres-rw
            - name: SETTING_REMOTE_POSTGRES_PORT
              value: "5432"
            - name: SETTING_REMOTE_POSTGRES_SSLMODE
              value: require
            - name: CONFIG_postgresql__database_user
              value: zulip
            - name: CONFIG_postgresql__database_name
              value: zulip
            - name: SECRETS_postgres_password
              valueFrom:
                secretKeyRef:
                  name: zulip-postgres-app
                  key: password
            - name: SETTING_RABBITMQ_HOST
              value: zulip-rabbitmq
            - name: SETTING_RABBITMQ_USERNAME
              value: zulip
            - name: SECRETS_rabbitmq_password
              valueFrom:
                secretKeyRef:
                  name: zulip-secrets
                  key: rabbitmq_password
            - name: SETTING_MEMCACHED_LOCATION
              value: zulip-memcached:11211
            - name: SETTING_MEMCACHED_USERNAME
              value: zulip@localhost
            - name: SECRETS_memcached_password
              valueFrom:
                secretKeyRef:
                  name: zulip-secrets
                  key: memcached_password
            - name: SETTING_REDIS_HOST
              value: zulip-redis
            - name: SETTING_REDIS_PORT
              value: "6379"
            - name: SECRETS_redis_password
              valueFrom:
                secretKeyRef:
                  name: zulip-secrets
                  key: redis_password
            - name: SECRETS_secret_key
              valueFrom:
                secretKeyRef:
                  name: zulip-secrets
                  key: secret_key
            - name: SECRETS_avatar_salt
              valueFrom:
                secretKeyRef:
                  name: zulip-secrets
                  key: avatar_salt
            - name: SECRETS_shared_secret
              valueFrom:
                secretKeyRef:
                  name: zulip-secrets
                  key: shared_secret
            - name: SECRETS_camo_key
              valueFrom:
                secretKeyRef:
                  name: zulip-secrets
                  key: camo_key
            - name: SECRETS_zulip_org_key
              valueFrom:
                secretKeyRef:
                  name: zulip-secrets
                  key: zulip_org_key
            - name: SECRETS_zulip_org_id
              valueFrom:
                secretKeyRef:
                  name: zulip-secrets
                  key: zulip_org_id
            - name: SETTING_LOCAL_UPLOADS_DIR
              value: None
            - name: SETTING_S3_AUTH_UPLOADS_BUCKET
              value: zulip-uploads
            - name: SETTING_S3_AVATAR_BUCKET
              value: zulip-avatars
            - name: SETTING_S3_ENDPOINT_URL
              value: https://dataverket.s3.osl1.dvkt.no
            - name: SETTING_S3_REGION
              value: us-east-1
            - name: SETTING_S3_ADDRESSING_STYLE
              value: path
            - name: SECRETS_s3_key
              valueFrom:
                secretKeyRef:
                  name: s3-zulip
                  key: ACCESS_KEY_ID
            - name: SECRETS_s3_secret_key
              valueFrom:
                secretKeyRef:
                  name: s3-zulip
                  key: SECRET_ACCESS_KEY
            - name: ZULIP_AUTH_BACKENDS
              value: EmailAuthBackend,GenericOpenIdConnectBackend
            - name: SETTING_SOCIAL_AUTH_OIDC_ENABLED_IDPS
              value: >-
                {"zitadel": {"oidc_url": "https://zitadel.dataverket.org", "display_name": "Dataverket",
                "client_id": "395237846727787789", "secret": get_secret("social_auth_oidc_secret"),
                "auto_signup": True}}
            - name: SECRETS_social_auth_oidc_secret
              valueFrom:
                secretKeyRef:
                  name: zulip-zitadel-oidc
                  key: CLIENT_SECRET
            - name: SETTING_EMAIL_HOST
              value: mail.nordhost.no
            - name: SETTING_EMAIL_PORT
              value: "465"
            - name: SETTING_EMAIL_USE_SSL
              value: "True"
            - name: SETTING_EMAIL_USE_TLS
              value: "False"
            - name: SETTING_NOREPLY_EMAIL_ADDRESS
              value: noreply@dataverket.org
            - name: SETTING_ADD_TOKENS_TO_NOREPLY_ADDRESS
              value: "False"
            - name: SETTING_EMAIL_HOST_USER
              valueFrom:
                secretKeyRef:
                  name: zulip-mailer
                  key: username
                  optional: true
            - name: SECRETS_email_password
              valueFrom:
                secretKeyRef:
                  name: zulip-mailer
                  key: password
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: organization
              mountPath: /organization
              readOnly: true
            - name: brand
              mountPath: /brand
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: organization
          configMap:
            name: zulip-organization
        - name: brand
          configMap:
            name: zulip-brand
