# zot's configuration. Anonymous pull everywhere; push only for the fabrikk-ci user in /secret/htpasswd
# (Secret zot-htpasswd, encrypted in this directory). Browser login goes through Zitadel (Secret zot-oidc); OIDC users are
# identified by email, so grant them in accessControl by email. They mint API keys in the UI for docker/skopeo.
# No delete for anyone yet: promotion retags, it never removes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: zot
data:
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "dedupe": true,
        "gc": true,
        "gcDelay": "1h",
        "gcInterval": "24h"
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "externalUrl": "https://registry.dataverket.org",
        "readTimeout": "5m",
        "writeTimeout": "5m",
        "auth": {
          "htpasswd": { "path": "/secret/htpasswd" },
          "openid": {
            "providers": {
              "oidc": {
                "name": "Zitadel",
                "issuer": "https://zitadel.dataverket.org",
                "credentialsFile": "/oidc/credentials.json",
                "scopes": ["openid", "profile", "email"]
              }
            }
          }
        },
        "accessControl": {
          "repositories": {
            "**": {
              "anonymousPolicy": ["read"],
              "defaultPolicy": ["read"],
              "policies": [
                { "users": ["fabrikk-ci"], "actions": ["read", "create", "update"] }
              ]
            }
          }
        }
      },
      "log": { "level": "info" },
      "extensions": {
        "search": { "enable": true },
        "scrub": { "enable": true, "interval": "24h" },
        "ui": { "enable": true },
        "apikey": { "enable": true }
      }
    }
