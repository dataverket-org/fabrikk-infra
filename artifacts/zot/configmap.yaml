# zot's configuration. Anonymous pull everywhere; push for the fabrikk-ci user, and under tools/ also for
# nordhost-pipeline, both in /secret/htpasswd (Secret zot-htpasswd, encrypted in this directory). zot applies the
# longest pattern a repository matches, so tools/** repeats the read policies and fabrikk-ci. Browser login goes
# through Zitadel (Secret zot-oidc); OIDC users are identified by email, so grant them in accessControl by email.
# They mint API keys in the UI for docker/skopeo.
# No delete for anyone yet: promotion retags, it never removes.
# compat docker2s2 takes Docker's manifest media types as they are: zot refuses them by default, and a mirror copied
# by digest must keep the upstream's bytes, so registry.k8s.io's lists and Docker Hub's older images stay as pushed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: zot
data:
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "dedupe": true,
        "gc": true,
        "gcDelay": "1h",
        "gcInterval": "24h"
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "externalUrl": "https://registry.dataverket.org",
        "readTimeout": "5m",
        "writeTimeout": "5m",
        "compat": ["docker2s2"],
        "auth": {
          "htpasswd": { "path": "/secret/htpasswd" },
          "openid": {
            "providers": {
              "oidc": {
                "name": "Zitadel",
                "issuer": "https://zitadel.dataverket.org",
                "credentialsFile": "/oidc/credentials.json",
                "scopes": ["openid", "profile", "email"]
              }
            }
          }
        },
        "accessControl": {
          "repositories": {
            "**": {
              "anonymousPolicy": ["read"],
              "defaultPolicy": ["read"],
              "policies": [
                { "users": ["fabrikk-ci"], "actions": ["read", "create", "update"] }
              ]
            },
            "tools/**": {
              "anonymousPolicy": ["read"],
              "defaultPolicy": ["read"],
              "policies": [
                { "users": ["fabrikk-ci", "nordhost-pipeline", "salmon-pipeline"], "actions": ["read", "create", "update"] }
              ]
            }
          }
        }
      },
      "log": { "level": "info" },
      "extensions": {
        "search": { "enable": true },
        "scrub": { "enable": true, "interval": "24h" },
        "ui": { "enable": true },
        "apikey": { "enable": true }
      }
    }
