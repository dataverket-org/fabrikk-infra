apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zot
  namespace: zot
spec:
  # Two names of one zot (decision 034): registry.dataverket.org, the registry of record on the wildcard listener,
  # and registry.osl1.dvkt.no, the site's name on its own listener, what this site's workloads pull by.
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-system
      sectionName: https
    - name: envoy-gateway
      namespace: envoy-system
      sectionName: https-registry-osl1
  hostnames:
    - "registry.dataverket.org"
    - "registry.osl1.dvkt.no"
  rules:
    - backendRefs:
        - name: zot
          port: 5000
      # Zero disables the request timeout; blob uploads are long requests.
      timeouts:
        request: 0s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zot-redirect
  namespace: zot
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-system
      sectionName: http
  hostnames:
    - "registry.dataverket.org"
    - "registry.osl1.dvkt.no"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
