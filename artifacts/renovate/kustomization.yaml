# Renovate for the repositories on the forge, a config artifact of plain manifests (decision 013):
# platform/renovate-config. What each file is, is in README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - cronjob.yaml
  - bootstrap.yaml
  - renovate-github.enc.yaml
configMapGenerator:
  - name: renovate-config
    namespace: renovate
    files:
      - config.js
  - name: renovate-guard
    namespace: renovate
    files:
      - guard.mjs
generatorOptions:
  disableNameSuffixHash: true
