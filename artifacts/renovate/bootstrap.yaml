# The bot user renovate and its token, made once per cluster and kept only in Secret renovate/renovate (README.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: renovate-bootstrap
  namespace: renovate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: renovate-bootstrap
  namespace: renovate
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [renovate]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: renovate-bootstrap
  namespace: renovate
subjects:
  - kind: ServiceAccount
    name: renovate-bootstrap
    namespace: renovate
roleRef:
  kind: Role
  name: renovate-bootstrap
  apiGroup: rbac.authorization.k8s.io
---
# exec cannot be limited to one pod by name (apps/forgejo/README.md, the actions mirror).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: renovate-bootstrap
  namespace: forgejo
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [forgejo]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: renovate-bootstrap
  namespace: forgejo
subjects:
  - kind: ServiceAccount
    name: renovate-bootstrap
    namespace: renovate
roleRef:
  kind: Role
  name: renovate-bootstrap
  apiGroup: rbac.authorization.k8s.io
---
# Once per cluster. A rerun while the Secret exists is a no-op, so Flux may recreate the Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: renovate-bootstrap
  namespace: renovate
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: renovate-bootstrap
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: FORGEJO_URL
              value: http://forgejo-http.forgejo.svc.cluster.local:3000
            - name: BOT
              value: renovate
            - name: BOT_EMAIL
              value: renovate@noreply.git.dataverket.org
            - name: KUBECTL_VERSION
              value: v1.36.6
            - name: KUBECTL_SHA256
              value: 29818b6729dc9262b692307470d0558d027725e738be5dd47c760261868a2634
          command:
            - sh
            - -euc
            - |
              cd /work
              curl -sSfL "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl" -o kubectl
              printf '%s  kubectl\n' "$KUBECTL_SHA256" | sha256sum -c -
              chmod +x kubectl
              export PATH="/work:$PATH"
              if kubectl -n renovate get secret renovate >/dev/null 2>&1; then
                echo "renovate/renovate exists; nothing to do"
                exit 0
              fi
              for i in $(seq 1 60); do
                curl -sf -o /dev/null "$FORGEJO_URL/api/healthz" && break
                [ "$i" -lt 60 ] || { echo "the forge did not answer within ten minutes"; exit 1; }
                sleep 10
              done
              fj() { kubectl -n forgejo exec deploy/forgejo -c forgejo -- forgejo "$@"; }
              # A user whose random password nobody keeps; the token is its only credential. Never an admin.
              if fj admin user list | awk 'NR > 1 { print $2 }' | grep -qx "$BOT"; then
                echo "user $BOT exists"
              else
                fj admin user create --username "$BOT" --email "$BOT_EMAIL" --random-password \
                  --must-change-password=false >/dev/null
                echo "user $BOT created"
              fi
              # A second token of the same name is refused; recovery is in docs/runbooks/renovate-token-lost.md.
              fj admin user generate-access-token --username "$BOT" --token-name renovate-cluster --raw \
                --scopes write:repository,write:issue,read:user,read:organization > /work/raw
              # The CronJob reads the Secret as environment, where a trailing newline would be part of the token.
              tr -d '\n' < /work/raw > /work/token
              kubectl -n renovate create secret generic renovate --from-file=RENOVATE_TOKEN=/work/token
              rm -f /work/raw /work/token
              echo "renovate/renovate created"
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir:
            medium: Memory
