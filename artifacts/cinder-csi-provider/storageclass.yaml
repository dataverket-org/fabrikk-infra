apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: csi-cinder-sc-delete
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: cinder.csi.openstack.org
reclaimPolicy: Delete
allowVolumeExpansion: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: csi-cinder-sc-retain
provisioner: cinder.csi.openstack.org
reclaimPolicy: Retain
allowVolumeExpansion: true
---
# Cinder's cheaper tier, for blobs that are rebuildable or backed up elsewhere; zot's (decision 018).
# The type is the name Nexthop gives it, as the openstack-volume-type model records it.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: csi-cinder-standard-retain
provisioner: cinder.csi.openstack.org
parameters:
  type: Standard
reclaimPolicy: Retain
allowVolumeExpansion: true
