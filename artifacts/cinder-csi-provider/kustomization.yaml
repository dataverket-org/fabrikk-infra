# The Cinder CSI driver and its StorageClasses, delivered as a config artifact (decision 013; the gitless plan):
# platform/cinder-csi-provider-config. The foundation: zot's own volume needs it, so at bootstrap this directory is
# applied from git first (bootstrap/foundation-from-git.yaml) and the artifact takes over once zot serves.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - nodeplugin-ds.yaml
  - nodeplugin-rbac.yaml
  - controller-ds.yaml
  - controller-rbac.yaml
  - csi-driver.yaml
  - storageclass.yaml
