apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: zitadel
spec:
  interval: 1h
  chart:
    spec:
      chart: zitadel
      version: "10.0.4"
      sourceRef:
        kind: HelmRepository
        name: zitadel-repo
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    zitadel:
      configmapConfig:
        # The name people and clients bind to, the upstream's (decisions 031, 034).
        # Setup adds it beside the names the instance has and removes nothing; the site alias and the removals
        # go through task admin:zitadel-domains. Also the audience the login's and the System API user's tokens
        # are checked against.
        ExternalDomain: id.dataverket.org
        # The public port, so the console's redirect URIs and the login's audience carry no :8080.
        ExternalPort: 443
        ExternalSecure: true
        # The System API user the operators hold (decision 032): the public half of
        # vaults/operator/osl1/zitadel-system.enc.json, base64 of zitadel-system-operators.pub.pem beside this
        # file, which the config loader decodes. The chart merges it beside its own login client. SYSTEM_OWNER
        # is the only system role with system.domain.write; task admin:zitadel-domains uses it for the domain
        # list and nothing else.
        SystemAPIUsers:
          operators:
            KeyData: 
            Memberships:
              - MemberType: System
                Roles:
                  - SYSTEM_OWNER
      masterkeySecretName: zitadel-masterkey
    login:
      # The chart's .env without X-Zitadel-Public-Host: with it every browser login would belong to ExternalDomain;
      # without it the browser's own host is the public host, so each name keeps its passkeys and no trusted domain
      # is needed. The audience stays right: the server checks it against ExternalDomain and ExternalPort.
      customConfigmapConfig: |
        ZITADEL_LOGINCLIENT_KEYFILE="/login-service-key/tls.key"
        AUDIENCE="https://${ZITADEL_EXTERNALDOMAIN}"
        ZITADEL_API_URL="http://zitadel:8080"
        CUSTOM_REQUEST_HEADERS="Host:${ZITADEL_EXTERNALDOMAIN}"
    env:
      - name: ZITADEL_DATABASE_POSTGRES_DSN
        valueFrom:
          secretKeyRef:
            name: zitadel-db-app
            key: uri
