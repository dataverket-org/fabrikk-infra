# The recipe: what bin/artifact forgejo turns into ../rendered/ (decision 028). The Forgejo chart 17.1.5 with the
# values that were the HelmRelease in apps/forgejo until the gitless plan's goal 2; the chart is vendored under
# charts/ so a render needs nothing from code.forgejo.org. The release name and namespace are the ones Helm used,
# so the rendered objects are the ones Helm made and marked keep at the handover. The chart's three Secrets hold
# app.ini and the init scripts, no credential; the credentials come from the *.enc.yaml beside rendered/ through
# env, as before. They are allowed by plain-secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: forgejo
    repo: oci://code.forgejo.org/forgejo-helm
    version: 17.1.5
    releaseName: forgejo
    namespace: forgejo
    skipTests: true
    kubeVersion: "1.34.0"
    valuesFile: values.yaml
patches:
  # The repositories' volume: the Cinder volume that carried them before 2026-11-08, when the namespace was
  # garbage-collected (docs/plans/2026-11-gitless.md, audit of goal 2). Its PV was set to Retain and its claim
  # released; the chart's PVC binds to it by name instead of provisioning an empty one.
  - target:
      kind: PersistentVolumeClaim
      name: gitea-shared-storage
    patch: |-
      - op: add
        path: /spec/volumeName
        value: pvc-b7554609-bc99-46f4-9293-d946ab4ac6bb
      - op: add
        path: /spec/storageClassName
        value: csi-cinder-sc-delete
