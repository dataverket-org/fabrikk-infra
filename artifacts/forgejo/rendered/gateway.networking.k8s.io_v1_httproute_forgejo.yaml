apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app: forgejo
    app.kubernetes.io/instance: forgejo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/version: 15.0.7
    helm.sh/chart: forgejo-17.1.5
    version: 15.0.7
  name: forgejo
  namespace: forgejo
spec:
  hostnames:
  - git.dataverket.org
  parentRefs:
  - name: envoy-gateway
    namespace: envoy-system
    sectionName: https
  rules:
  - backendRefs:
    - kind: Service
      name: forgejo-http
      port: 3000
    matches:
    - path:
        type: PathPrefix
        value: /
