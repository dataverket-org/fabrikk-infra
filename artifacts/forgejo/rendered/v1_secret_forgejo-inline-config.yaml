apiVersion: v1
kind: Secret
metadata:
  labels:
    app: forgejo
    app.kubernetes.io/instance: forgejo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/version: 15.0.7
    helm.sh/chart: forgejo-17.1.5
    version: 15.0.7
  name: forgejo-inline-config
  namespace: forgejo
stringData:
  _generals_: |-
    APP_NAME=Dataverket
    RUN_MODE=prod
  actions: DEFAULT_ACTIONS_URL=self
  cache: |-
    ADAPTER=memory
    HOST=
  database: |-
    DB_TYPE=postgres
    HOST=forgejo-postgres-rw:5432
    NAME=forgejo
    USER=forgejo
  mailer: |-
    enabled=true
    from=noreply@dataverket.org
    protocol=smtps
    smtp_addr=mail.nordhost.no
    smtp_port=465
  metrics: ENABLED=false
  packages: ENABLED=false
  queue: |-
    CONN_STR=
    TYPE=level
  repository: ROOT=/data/git/gitea-repositories
  security: INSTALL_LOCK=true
  server: |-
    APP_DATA_PATH=/data
    DOMAIN=git.dataverket.org
    ENABLE_PPROF=false
    HTTP_PORT=3000
    PROTOCOL=http
    ROOT_URL=https://git.dataverket.org
    SSH_DOMAIN=git.dataverket.org
    SSH_LISTEN_PORT=2222
    SSH_PORT=22
    START_SSH_SERVER=true
  service: |-
    DISABLE_REGISTRATION=false
    ENABLE_BASIC_AUTHENTICATION=false
    ENABLE_INTERNAL_SIGNIN=false
    ENABLE_NOTIFY_MAIL=true
    SHOW_REGISTRATION_BUTTON=false
  session: |-
    PROVIDER=memory
    PROVIDER_CONFIG=
  ui: |-
    DEFAULT_THEME=dataverket-auto
    THEMES=dataverket-auto,dataverket-light,dataverket-dark
type: Opaque
