apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-postgres
  namespace: forgejo
spec:
  # One instance on one Cinder volume (decision 018). No PodDisruptionBudget, so a drain moves it.
  instances: 1
  enablePDB: false
  # Recovery needs the archive's Postgres major; the same image the cluster ran before.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  storage:
    storageClass: csi-cinder-sc-delete
    # 20Gi since 2026-10-06: the volume filled with WAL while the hov1 gateway was down for two days after a host
    # reboot, and Postgres refuses to start without room for WAL. Grown live first, the forge being down with it.
    size: 20Gi
  postgresql:
    parameters:
      max_wal_size: 1GB
  # Archiving to the hov1 site (backup.yaml, backup/README.md); serverName is this cluster's own folder.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: hov1
        serverName: forgejo-postgres-2
  # Bootstrap from the hov1 archive, read by CNPG only at creation; a rebuild moves serverName first
  # (decision 021, docs/storage.md).
  bootstrap:
    recovery:
      source: hov1-archive
      database: forgejo
      owner: forgejo
  externalClusters:
    - name: hov1-archive
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: hov1
          serverName: forgejo-postgres-2
