# The forge's own actions org, a frozen copy of the Forgejo project's set, promoted after a quarantine
# (decisions 022 and 023). How the Job and the CronJob work, and how a person intervenes: README.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: actions-mirror-bootstrap
  namespace: forgejo
---
# exec cannot be limited to one pod by name (README.md).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: actions-mirror-bootstrap
  namespace: forgejo
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [actions-mirror-token]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [forgejo]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: actions-mirror-bootstrap
  namespace: forgejo
subjects:
  - kind: ServiceAccount
    name: actions-mirror-bootstrap
    namespace: forgejo
roleRef:
  kind: Role
  name: actions-mirror-bootstrap
  apiGroup: rbac.authorization.k8s.io
---
# Once per cluster: the bot, its token into Secret actions-mirror-token, the org. A rerun is a no-op (README.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: actions-mirror-bootstrap
  namespace: forgejo
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: actions-mirror-bootstrap
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: docker.io/curlimages/curl:8.17.0@sha256:43ebaa53d3806db6b1ce4353b6b26ae638ec1c167ee351524b05690f988bb20d
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: FORGEJO_URL
              value: http://forgejo-http.forgejo.svc.cluster.local:3000
            - name: BOT
              value: actions-mirror
            - name: BOT_EMAIL
              value: actions-mirror@noreply.git.dataverket.org
            - name: ORG
              value: actions
            - name: JQ_VERSION
              value: jq-1.7.1
            - name: JQ_SHA256
              value: 5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5
            - name: KUBECTL_VERSION
              value: v1.36.4
            - name: KUBECTL_SHA256
              value: 8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a
          command:
            - sh
            - -euc
            - |
              cd /work
              curl -sSfL "https://github.com/jqlang/jq/releases/download/$JQ_VERSION/jq-linux-amd64" -o jq
              curl -sSfL "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl" -o kubectl
              printf '%s  jq\n%s  kubectl\n' "$JQ_SHA256" "$KUBECTL_SHA256" | sha256sum -c -
              chmod +x jq kubectl
              export PATH="/work:$PATH"
              if kubectl -n forgejo get secret actions-mirror-token >/dev/null 2>&1; then
                echo "forgejo/actions-mirror-token exists; nothing to do"
                exit 0
              fi
              # Applied together with the release, so the forge may still be starting.
              for i in $(seq 1 60); do
                curl -sf -o /dev/null "$FORGEJO_URL/api/healthz" && break
                [ "$i" -lt 60 ] || { echo "the forge did not answer within ten minutes"; exit 1; }
                sleep 10
              done
              fj() { kubectl -n forgejo exec deploy/forgejo -c forgejo -- forgejo "$@"; }
              # The bot: a user whose random password nobody keeps; the token is its only credential.
              if fj admin user list | awk 'NR > 1 { print $2 }' | grep -qx "$BOT"; then
                echo "user $BOT exists"
              else
                fj admin user create --username "$BOT" --email "$BOT_EMAIL" --random-password \
                  --must-change-password=false >/dev/null
                echo "user $BOT created"
              fi
              # A second token of the same name is refused; recovery is in README.md.
              fj admin user generate-access-token --username "$BOT" --token-name actions-mirror --raw \
                --scopes write:repository,read:organization,write:organization > /work/token
              printf 'Authorization: token %s\n' "$(cat /work/token)" > /work/auth
              # Name, description and avatar follow the source org; the mirror job sets them within the hour.
              body="$(jq -n --arg o "$ORG" '{username: $o, visibility: "public", repo_admin_change_team_access: false}')"
              case "$(curl -sS -o /work/resp -w '%{http_code}' -H @/work/auth -H 'Content-Type: application/json' \
                  -X POST --data "$body" "$FORGEJO_URL/api/v1/orgs")" in
                201) echo "org $ORG created, owned by $BOT" ;;
                422) echo "org $ORG exists; make sure $BOT is one of its owners, or the mirror job cannot create repositories" ;;
                *) echo "creating org $ORG failed:"; cat /work/resp; exit 1 ;;
              esac
              rm -f /work/resp /work/auth
              kubectl -n forgejo create secret generic actions-mirror-token --from-file=token=/work/token
              rm -f /work/token
              echo "forgejo/actions-mirror-token created"
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir:
            medium: Memory
---
# Daily: promote what is QUARANTINE_DAYS old, sync nothing else, delete nothing (decision 023, README.md).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: actions-mirror
  namespace: forgejo
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mirror
              image: docker.io/curlimages/curl:8.17.0@sha256:43ebaa53d3806db6b1ce4353b6b26ae638ec1c167ee351524b05690f988bb20d
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                - name: FORGEJO_URL
                  value: http://forgejo-http.forgejo.svc.cluster.local:3000
                - name: ORG
                  value: actions
                - name: SOURCE_URL
                  value: https://code.forgejo.org
                - name: SOURCE_ORG
                  value: actions
                - name: QUARANTINE_DAYS
                  value: "7"
                - name: TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: actions-mirror-token
                      key: token
                - name: JQ_VERSION
                  value: jq-1.7.1
                - name: JQ_SHA256
                  value: 5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5
              command:
                - sh
                - -euc
                - |
                  cd /work
                  curl -sSfL "https://github.com/jqlang/jq/releases/download/$JQ_VERSION/jq-linux-amd64" -o jq
                  printf '%s  jq\n' "$JQ_SHA256" | sha256sum -c -
                  chmod +x jq
                  printf 'Authorization: token %s\n' "$TOKEN" > /work/auth
                  here() { curl -sS -o /work/resp -w '%{http_code}' -H @/work/auth -H 'Content-Type: application/json' "$@"; }
                  # Name, description, avatar and website follow the source org (README.md).
                  curl -sSf -o /work/source "$SOURCE_URL/api/v1/orgs/$SOURCE_ORG"
                  body="$(./jq --arg w "$SOURCE_URL/$SOURCE_ORG" '{full_name: .full_name, description: .description, website: $w}' /work/source)"
                  case "$(here -X PATCH --data "$body" "$FORGEJO_URL/api/v1/orgs/$ORG")" in
                    200) ;;
                    *) echo "setting the name of $ORG failed:"; cat /work/resp; echo; exit 1 ;;
                  esac
                  curl -sSf -o /work/avatar "$(./jq -r '.avatar_url' /work/source)"
                  ./jq -n --arg i "$(base64 /work/avatar | tr -d '\n')" '{image: $i}' > /work/avatar.json
                  case "$(here -X POST --data @/work/avatar.json "$FORGEJO_URL/api/v1/orgs/$ORG/avatar")" in
                    204) ;;
                    *) echo "setting the avatar of $ORG failed:"; cat /work/resp; echo; exit 1 ;;
                  esac
                  # Seconds since a timestamp of the forge's form; the forge's "never" (year 1) counts as long ago.
                  age_days() { ./jq -rn --arg t "$1" 'try (((now - ($t | fromdateiso8601)) / 86400) | floor) catch 100000'; }
                  page=1 current=0 waiting=0 created=0 promoted=0 failed=0
                  while :; do
                    curl -sSf -o /work/src "$SOURCE_URL/api/v1/orgs/$SOURCE_ORG/repos?limit=50&page=$page"
                    [ "$(./jq length /work/src)" -gt 0 ] || break
                    for name in $(./jq -r '.[].name' /work/src); do
                      updated="$(./jq -r --arg n "$name" '.[] | select(.name == $n) | .updated_at' /work/src)"
                      age="$(age_days "$updated")"
                      case "$(here "$FORGEJO_URL/api/v1/repos/$ORG/$name")" in
                        200)
                          # Frozen: the mirror syncs only when this Job says so.
                          if [ "$(./jq -r '.mirror_interval' /work/resp)" != "0s" ]; then
                            case "$(here -X PATCH --data '{"mirror_interval": "0s"}' "$FORGEJO_URL/api/v1/repos/$ORG/$name")" in
                              200) echo "froze $ORG/$name" ;;
                              *) echo "freezing $ORG/$name failed:"; cat /work/resp; echo; failed=$((failed + 1)) ;;
                            esac
                            here "$FORGEJO_URL/api/v1/repos/$ORG/$name" >/dev/null
                          fi
                          synced_age="$(age_days "$(./jq -r '.mirror_updated' /work/resp)")"
                          if [ "$age" -ge "$synced_age" ]; then
                            current=$((current + 1))
                          elif [ "$age" -lt "$QUARANTINE_DAYS" ]; then
                            echo "$ORG/$name: the source changed $updated, $age days ago; waiting"
                            waiting=$((waiting + 1))
                          else
                            case "$(here -X POST "$FORGEJO_URL/api/v1/repos/$ORG/$name/mirror-sync")" in
                              200) echo "promoted $ORG/$name: the source changed $updated, $age days ago"; promoted=$((promoted + 1)) ;;
                              *) echo "syncing $ORG/$name failed:"; cat /work/resp; echo; failed=$((failed + 1)); continue ;;
                            esac
                          fi
                          ;;
                        404)
                          if [ "$age" -lt "$QUARANTINE_DAYS" ]; then
                            echo "$ORG/$name: new in the source, changed $updated, $age days ago; waiting"
                            waiting=$((waiting + 1))
                            continue
                          fi
                          body="$(./jq -n --arg a "$SOURCE_URL/$SOURCE_ORG/$name.git" --arg o "$ORG" --arg n "$name" \
                            --arg d "Frozen copy of $SOURCE_URL/$SOURCE_ORG/$name, promoted after a quarantine (decision 023 in dataverket/fabrikk-infra)" \
                            '{clone_addr: $a, repo_owner: $o, repo_name: $n, mirror: true, mirror_interval: "0s", service: "git", description: $d}')"
                          case "$(here -X POST --data "$body" "$FORGEJO_URL/api/v1/repos/migrate")" in
                            201) echo "created $ORG/$name at the source's state of $updated, $age days old"; created=$((created + 1)) ;;
                            *) echo "creating $ORG/$name failed:"; cat /work/resp; echo; failed=$((failed + 1)); continue ;;
                          esac
                          ;;
                        *) echo "reading $ORG/$name failed:"; cat /work/resp; echo; failed=$((failed + 1)); continue ;;
                      esac
                      for topic in upstream-mirror actions; do
                        case "$(here -X PUT "$FORGEJO_URL/api/v1/repos/$ORG/$name/topics/$topic")" in
                          204) ;;
                          *) echo "topic $topic on $ORG/$name: HTTP $(cat /work/resp | head -c 200)" ;;
                        esac
                      done
                    done
                    page=$((page + 1))
                  done
                  rm -f /work/auth
                  echo "$current current, $waiting waiting, $created created, $promoted promoted, $failed failed"
                  [ "$failed" -eq 0 ]
              volumeMounts:
                - name: work
                  mountPath: /work
          volumes:
            - name: work
              emptyDir:
                medium: Memory
