# The S3 service at the osl1 site: one versitygw, posix backend, one Cinder volume (README.md,
# docs/plans/2026-10-s3-osl1.md, decision 018). /data, /versioning and /iam are subPaths of the one claim.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: versitygw
  namespace: versitygw
spec:
  serviceName: versitygw
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: versitygw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: versitygw
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: versitygw
          image: ghcr.io/versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
          # Global options before the backend, backend options after it (README.md).
          args:
            - --port=:7070
            - --admin-port=:7071
            - --region=us-east-1
            - --health=/_/health
            - --iam-dir=/iam
            - posix
            - --versioning-dir=/versioning
            - /data
          env:
            - name: ROOT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: versitygw-root
                  key: ROOT_ACCESS_KEY
            - name: ROOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: versitygw-root
                  key: ROOT_SECRET_KEY
          ports:
            - name: s3
              containerPort: 7070
            - name: admin
              containerPort: 7071
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /_/health
              port: s3
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /_/health
              port: s3
          livenessProbe:
            httpGet:
              path: /_/health
              port: s3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: data
            - name: data
              mountPath: /versioning
              subPath: versioning
            - name: data
              mountPath: /iam
              subPath: iam
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: csi-cinder-standard-retain
        resources:
          requests:
            storage: 20Gi
