# The public name, path-style (docs/plans/2026-10-s3-osl1.md).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: versitygw
  namespace: versitygw
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-system
      sectionName: https-s3-osl1
  hostnames:
    - "dataverket.s3.osl1.dvkt.no"
  rules:
    - backendRefs:
        - name: versitygw
          port: 7070
      # Zero disables the request timeout; uploads are long requests.
      timeouts:
        request: 0s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: versitygw-redirect
  namespace: versitygw
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-system
      sectionName: http
  hostnames:
    - "dataverket.s3.osl1.dvkt.no"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
