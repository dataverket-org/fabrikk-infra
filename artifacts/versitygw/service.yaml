# The S3 API.
apiVersion: v1
kind: Service
metadata:
  name: versitygw
  namespace: versitygw
spec:
  selector:
    app.kubernetes.io/name: versitygw
  ports:
    - name: s3
      port: 7070
      targetPort: s3
---
# The admin API, never routed; reached by port-forward (README.md).
apiVersion: v1
kind: Service
metadata:
  name: versitygw-admin
  namespace: versitygw
spec:
  selector:
    app.kubernetes.io/name: versitygw
  ports:
    - name: admin
      port: 7071
      targetPort: admin
