apiVersion: v1
data:
  theme-dataverket-auto.css: |
    /* Generated by make-theme.py. Do not edit. */
    @import url("/assets/css/theme-forgejo-auto.css");

    gitea-theme-meta-info {
      --theme-display-name: "Dataverket Auto";
      --theme-color-scheme: "auto";
    }

    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/assets/fonts/inter-latin-400-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("/assets/fonts/inter-latin-500-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url("/assets/fonts/inter-latin-600-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "JetBrains Mono";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "JetBrains Mono";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("/assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2");
    }

    :root {
      --fonts-proportional: Inter, -apple-system, "Segoe UI", system-ui, sans-serif;
      --fonts-monospace: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      /* Neutral surface, re-tinted to the Dataverket slate. Both scales:
         light derives from zinc, dark from steel. */
      --zinc-50: #f8fafb;
      --zinc-100: #f2f5f8;
      --zinc-150: #e8edf2;
      --zinc-200: #dee5ed;
      --zinc-250: #d4dde7;
      --zinc-300: #cad5e2;
      --zinc-350: #aabbd0;
      --zinc-400: #8ca3bf;
      --zinc-450: #6b89ad;
      --zinc-500: #547297;
      --zinc-550: #496383;
      --zinc-600: #3e5470;
      --zinc-650: #374b62;
      --zinc-700: #2f4155;
      --zinc-750: #263445;
      --zinc-800: #1d2835;
      --zinc-850: #18202b;
      --zinc-900: #121921;
      --steel-100: #d8e0ea;
      --steel-150: #c3cfde;
      --steel-200: #adbdd1;
      --steel-250: #97acc6;
      --steel-300: #829bba;
      --steel-350: #6d8bae;
      --steel-400: #5a7ba2;
      --steel-450: #4f6d8f;
      --steel-500: #455e7c;
      --steel-550: #3b506a;
      --steel-600: #314258;
      --steel-650: #273546;
      --steel-700: #212d3b;
      --steel-750: #1b2531;
      --steel-800: #161e27;
      --steel-850: #131921;
      --steel-900: #10161d;

      /* Accent: Dataverket navy. */
      --color-primary: #0A2A5E;
      --color-primary-contrast: #ffffff;
      --color-primary-hover: #213e6d;
      --color-primary-active: #36507b;
      --color-primary-light-1: #213e6d;
      --color-primary-light-2: #36507b;
      --color-primary-light-3: #465e85;
      --color-primary-light-4: #667a9a;
      --color-primary-light-5: #b2bccd;
      --color-primary-light-6: #e5e9ee;
      --color-primary-light-7: #f2f4f6;
      --color-primary-dark-1: #092655;
      --color-primary-dark-2: #08224c;
      --color-primary-dark-3: #071e42;
      --color-primary-dark-4: #061a39;
      --color-primary-dark-5: #051530;
      --color-primary-dark-6: #041127;
      --color-primary-dark-7: #030d1d;
      --color-primary-alpha-10: #0A2A5E1a;
      --color-primary-alpha-20: #0A2A5E33;
      --color-primary-alpha-30: #0A2A5E4c;
      --color-primary-alpha-40: #0A2A5E66;
      --color-primary-alpha-50: #0A2A5E80;
      --color-primary-alpha-60: #0A2A5E99;
      --color-primary-alpha-70: #0A2A5Eb2;
      --color-primary-alpha-80: #0A2A5Ecc;
      --color-primary-alpha-90: #0A2A5Ee6;
      --color-accent: #0A2A5E;
      --color-small-accent: #e5e9ee;

      /* Flag red, across the whole red family. The navy and red together
         are the identity, and keeping one hue wherever red appears means
         labels, badges and errors all read as Dataverket rather than as
         two different reds. */
      --color-red: #BA0C2F;
      --color-red-dark-1: #960a26;
      --color-red-dark-2: #74071d;
      --color-red-light: #cc4c66;
      --color-red-badge: #ba0d30;
      --color-red-badge-bg: #BA0C2F21;
      --color-red-badge-hover-bg: #BA0C2F45;
      --color-error-bg: #fbf1f3;
      --color-error-bg-hover: #f7e4e8;
      --color-error-bg-active: #f2d2d8;
      --color-error-border: #e7acb8;
      --color-error-text: #5c0617;
    }

    /* Forgejo renders the logo as <img>, which CSS cannot recolour. */
    img[src$="/img/logo.svg"] {
      content: url("/assets/img/logo-dataverket-light.svg");
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fonts-proportional: Inter, -apple-system, "Segoe UI", system-ui, sans-serif;
        --fonts-monospace: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

        /* Neutral surface, re-tinted to the Dataverket slate. Both scales:
           light derives from zinc, dark from steel. */
        --zinc-50: #f9fafa;
        --zinc-100: #f4f5f6;
        --zinc-150: #ecedef;
        --zinc-200: #e3e6e8;
        --zinc-250: #dbdee1;
        --zinc-300: #d3d6da;
        --zinc-350: #b7bdc2;
        --zinc-400: #9ea6ad;
        --zinc-450: #838c96;
        --zinc-500: #6b757f;
        --zinc-550: #5d666f;
        --zinc-600: #4f575e;
        --zinc-650: #464d53;
        --zinc-700: #3d4248;
        --zinc-750: #31363a;
        --zinc-800: #25292c;
        --zinc-850: #1e2124;
        --zinc-900: #171a1c;
        --steel-100: #dee1e3;
        --steel-150: #ccd0d4;
        --steel-200: #babfc4;
        --steel-250: #a8aeb5;
        --steel-300: #959ea6;
        --steel-350: #848e97;
        --steel-400: #737e89;
        --steel-450: #666f79;
        --steel-500: #586069;
        --steel-550: #4c535a;
        --steel-600: #3e444a;
        --steel-650: #32373b;
        --steel-700: #2a2e32;
        --steel-750: #232629;
        --steel-800: #1c1f21;
        --steel-850: #181a1c;
        --steel-900: #151618;

        /* Accent: Dataverket navy. */
        --color-primary: #1967e6;
        --color-primary-contrast: #000000;
        --color-primary-hover: #397cea;
        --color-primary-active: #165bcb;
        --color-primary-light-1: #397cea;
        --color-primary-light-2: #5992ed;
        --color-primary-light-3: #79a7f1;
        --color-primary-light-4: #9abcf4;
        --color-primary-light-5: #b5cef7;
        --color-primary-light-6: #ccdefa;
        --color-primary-light-7: #dfeafc;
        --color-primary-dark-1: #165bcb;
        --color-primary-dark-2: #134eaf;
        --color-primary-dark-3: #104294;
        --color-primary-dark-4: #0d3678;
        --color-primary-dark-5: #0a2b61;
        --color-primary-dark-6: #08214a;
        --color-primary-dark-7: #061937;
        --color-primary-alpha-10: #1967e61a;
        --color-primary-alpha-20: #1967e633;
        --color-primary-alpha-30: #1967e64c;
        --color-primary-alpha-40: #1967e666;
        --color-primary-alpha-50: #1967e680;
        --color-primary-alpha-60: #1967e699;
        --color-primary-alpha-70: #1967e6b2;
        --color-primary-alpha-80: #1967e6cc;
        --color-primary-alpha-90: #1967e6e6;
        --color-accent: #1967e6;
        --color-small-accent: #0b2d65;

        /* Flag red, across the whole red family. The navy and red together
           are the identity, and keeping one hue wherever red appears means
           labels, badges and errors all read as Dataverket rather than as
           two different reds. */
        --color-red: #d77488;
        --color-red-dark-1: #e091a1;
        --color-red-dark-2: #e8aeba;
        --color-red-light: #ba6b6e;
        --color-red-badge: #d09a9d;
        --color-red-badge-bg: #d7748821;
        --color-red-badge-hover-bg: #d7748845;
        --color-error-bg: #381416;
        --color-error-bg-hover: #501d20;
        --color-error-bg-active: #5d2225;
        --color-error-border: #8a3237;
        --color-error-text: #f5eaea;
      }

      /* Forgejo renders the logo as <img>, which CSS cannot recolour. */
      img[src$="/img/logo.svg"] {
        content: url("/assets/img/logo-dataverket-dark.svg");
      }
    }
