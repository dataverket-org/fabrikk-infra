# The chart's values, as the HelmRelease carried them. A file, not valuesInline: kustomize drops a null when it
# serialises inline values, and a null here deletes a chart default (the runner's sample envs).
# Named here over the chart's own: the chart has no release after the one in git, and its version labels keep its appVersion.
image:
  tag: 13.2.2@sha256:a8543a45fe62bebef0534d5c223cf485d3294e6dd2e42a82dbcbfd40c54a6a22
dind:
  image:
    tag: 29.10.0-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 4Gi
resources:
  requests:
    cpu: 250m
    memory: 256Mi
runner:
  config:
    instance: https://git.dataverket.org
    existingSecret: org-dataverket-runner-secret
    # Jobs reach the pod's dind, the chart's values-dind-bypass.yaml (README.md).
    file:
      runner:
        envs:
          A_TEST_ENV_NAME_1: null
          A_TEST_ENV_NAME_2: null
          DOCKER_HOST: tcp://127.0.0.1:2376
          DOCKER_TLS_VERIFY: 1
          DOCKER_CERT_PATH: /certs/client
      container:
        network: host
        options: -v /certs/client:/certs/client
        valid_volumes:
          - /certs/client
# The docker store, a Cinder volume at dind's /var/lib/docker (README.md).
volumes:
  - name: docker-store
    persistentVolumeClaim:
      claimName: org-dataverket-runner-docker
volumeMounts:
  - name: docker-store
    mountPath: /var/lib/docker
