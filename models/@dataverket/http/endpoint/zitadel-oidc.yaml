type: '@dataverket/http/endpoint'
typeVersion: 2026.10.29.1
id: d36eb225-f353-4791-8d47-cd9e90b77a55
name: zitadel-oidc
version: 1
tags: {}
# Identity: Zitadel's OIDC discovery document, which must name its authorization endpoint, so a Zitadel that
# answers but is not configured fails too. Plain GET, no credential.
globalArguments:
  url: 'https://zitadel.dataverket.org/.well-known/openid-configuration'
  expectStatus: 200
  followRedirects: true
  maxRedirects: 5
  bodyContains: authorization_endpoint
  timeoutMs: 10000
  caFile: ''
  userAgent: swamp @dataverket/http
methods: {}
