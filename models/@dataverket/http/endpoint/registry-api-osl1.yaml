type: '@dataverket/http/endpoint'
typeVersion: 2026.10.29.1
id: 7d1f3b2a-9c4e-4e81-a6b5-2f8c0d9e1a73
name: registry-api-osl1
version: 1
tags: {}
# The same zot by the site's name, registry.osl1.dvkt.no, the site's mirror endpoint for pulls of the registry of
# record (decision 034);
# anonymous pull is on, so /v2/ answers 200 without a credential. registry-api checks the registry of record.
globalArguments:
  url: 'https://registry.osl1.dvkt.no/v2/'
  expectStatus: 200
  followRedirects: true
  maxRedirects: 5
  bodyContains: ''
  timeoutMs: 10000
  caFile: ''
  userAgent: swamp @dataverket/http
methods: {}
