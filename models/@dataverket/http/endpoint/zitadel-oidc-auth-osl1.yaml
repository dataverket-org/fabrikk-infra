type: '@dataverket/http/endpoint'
typeVersion: 2026.10.29.1
id: 61eabde9-e895-4a0b-9d7d-9d9050d3a2d4
name: zitadel-oidc-auth-osl1
version: 1
tags: {}
# Identity: Zitadel's OIDC discovery document at the site's name, which must name that name as its issuer, so a
# route that answers but an instance not yet told about the name fails too (docs/plans/2026-11-zitadel-auth-osl1.md).
# Plain GET, no credential. Fails by design between steps 1 and 2 of the plan.
globalArguments:
  url: 'https://auth.osl1.dvkt.no/.well-known/openid-configuration'
  expectStatus: 200
  followRedirects: true
  maxRedirects: 5
  bodyContains: '"issuer":"https://auth.osl1.dvkt.no"'
  timeoutMs: 10000
  caFile: ''
  userAgent: swamp @dataverket/http
methods: {}
