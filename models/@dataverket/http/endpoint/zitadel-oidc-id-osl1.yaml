type: '@dataverket/http/endpoint'
typeVersion: 2026.10.29.1
id: 99171827-cdca-46f5-969e-9128ddf79dab
name: zitadel-oidc-id-osl1
version: 1
tags: {}
# Identity: Zitadel's OIDC discovery document at id.osl1.dvkt.no, this site's alias and the primary instance domain (decisions 031, 032), which must name itself as
# its issuer, so a route that answers but an instance not yet told about the name fails too
# (decisions 031 and 034). Plain GET, no credential.
globalArguments:
  url: 'https://id.osl1.dvkt.no/.well-known/openid-configuration'
  expectStatus: 200
  followRedirects: true
  maxRedirects: 5
  bodyContains: '"issuer":"https://id.osl1.dvkt.no"'
  timeoutMs: 10000
  caFile: ''
  userAgent: swamp @dataverket/http
methods: {}
