type: '@dataverket/zitadel/system'
typeVersion: 2026.11.02.1
id: 2f7a1c94-6e3b-4d02-9b85-1a6c4e7d8f30
name: zitadel-system
version: 1
tags: {}
# The instance's domain list, kept with the System API user the operators hold (decision 032). The key is in the
# operator store and reaches swamp through the FIFO named here, which bin/zitadel-domains makes for one run; the
# definition itself holds nothing. apiUrl is the assertion's audience and must equal what the server builds from
# ExternalDomain, ExternalPort and ExternalSecure: auth.osl1.dvkt.no since goal D of the Zitadel plan, and
# id.dataverket.org once goal K has moved ExternalDomain.
globalArguments:
  apiUrl: 'https://auth.osl1.dvkt.no'
  systemUser: operators
  systemKeyFile: '~/.config/zitadel/fabrikk-infra-system.pem'
methods: {}
