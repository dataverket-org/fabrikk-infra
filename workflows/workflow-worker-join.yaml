id: d1d71cd7-09c2-4d55-95c3-4dc55e65e7bf
name: worker-join
description: >-
  Add one worker to the cluster, the first half of a swap (decision 017; docs/storage.md):
  a new server in the anti-affinity group, its storage patch from a file in git scoped to that machine, the machine
  added to the workers' machine set, and checks that it is a Ready node with the extensions and the disk layout the
  patch states. The server's ID is its Omni machine UUID. Nothing here touches an existing worker. Steps that wait on
  the machine, its registration in Omni and the node becoming Ready, fail rather than poll; rerun them with
  swamp workflow resume worker-join --run <id> --from <step>, naming the step the failed check reads, since without
  --from only the check reruns, against the same records. Extensions come from the machine set (setExtensions), not from here.
tags: {}
inputs:
  properties:
    name:
      type: string
      description: The new server's name, e.g. dataverket-wrkr-5; also its hostname and node name
    patchFile:
      type: string
      default: talos/dataverket-prod/workers-storage.yaml
      description: The storage patch, a file in this repository
    cluster:
      type: string
      default: dataverket-prod
    machineSet:
      type: string
      default: dataverket-prod-workers
    serverGroup:
      type: string
      default: dataverket-prod-workers
    flavor:
      type: string
      default: m5.large
    image:
      type: string
      default: dataverket-omni-talos-amd64
    network:
      type: string
      default: infra1-net
    description:
      type: string
      default: dataverket kubernetes cluster worker nodes
    ephemeralGiB:
      type: integer
      default: 14
      description: EPHEMERAL's size in the patch
    userVolume:
      type: string
      default: pg-zitadel
    userVolumeGiB:
      type: integer
      default: 11
      description: The user volume's size in the patch
    extensionLabel:
      type: string
      default: extensions.talos.dev/kata-containers
      description: A node label the machine set's extensions put on every worker
  required:
    - name
jobs:
  - name: join
    description: Server, patch, machine set.
    steps:
      - name: create-server
        description: The server, in the anti-affinity group; an existing server of the same name is reused.
        task:
          type: model_method
          modelIdOrName: openstack-server
          methodName: create
          inputs:
            name: ${{ inputs.name }}
            flavor: ${{ inputs.flavor }}
            image: ${{ inputs.image }}
            networks:
              - ${{ inputs.network }}
            securityGroups:
              - default
            serverGroup: ${{ inputs.serverGroup }}
            description: ${{ inputs.description }}
            wait: true
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: discover
        description: Every machine Omni knows.
        task:
          type: model_method
          modelIdOrName: omni
          methodName: discover
          inputs: {}
        dependsOn:
          - step: create-server
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: registered
        description: Omni knows the new machine and it is in no machine set yet.
        task:
          type: assert
          expr: >-
            data.findBySpec("omni", "node").exists(r, r.tags.?workflowRunId.orValue("") == run.id && r.attributes.id == data.latest("openstack-server", "server-" + inputs.name).attributes.id
            && r.attributes.machineSet == null)
          message: >-
            Omni does not list ${{ inputs.name }} as a free machine yet; it registers within a minute of booting.
            swamp workflow resume worker-join --run <id> --from discover
          severity: high
        dependsOn:
          - step: discover
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: apply-patch
        description: The storage patch from git, scoped to this machine before it joins.
        task:
          type: model_method
          modelIdOrName: omni-cluster
          methodName: applyPatch
          inputs:
            id: ${{ "500-" + inputs.name + "-storage" }}
            dataFile: ${{ inputs.patchFile }}
            machine: ${{ data.latest("openstack-server", "server-" + inputs.name).attributes.id }}
        dependsOn:
          - step: registered
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: add-machine
        description: Into the workers' machine set; Omni installs Talos with the patch and the set's extensions.
        task:
          type: model_method
          modelIdOrName: omni-cluster
          methodName: addMachine
          inputs:
            machine: ${{ data.latest("openstack-server", "server-" + inputs.name).attributes.id }}
            cluster: ${{ inputs.cluster }}
            machineSet: ${{ inputs.machineSet }}
        dependsOn:
          - step: apply-patch
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
  - name: check
    description: A Ready node with the extensions and the disk layout the patch states.
    steps:
      - name: node-get
        description: The Kubernetes node.
        task:
          type: model_method
          modelIdOrName: dataverket-prod-nodes
          methodName: get
          inputs:
            nodeName: ${{ inputs.name }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: node-ready
        description: Ready, schedulable and carrying the extension label.
        task:
          type: assert
          expr: >-
            data.findBySpec("dataverket-prod-nodes", "node").exists(r, r.tags.?workflowRunId.orValue("") == run.id && r.attributes.name == inputs.name
            && r.attributes.conditions.exists(c, c.type == "Ready" && c.status == "True")
            && inputs.extensionLabel in r.attributes.labels)
          message: >-
            ${{ inputs.name }} is not a Ready node with ${{ inputs.extensionLabel }} yet; installing and joining takes a
            few minutes. swamp workflow resume worker-join --run <id> --from node-get. If it stays so, read its Talos services and volumes.
          severity: high
        dependsOn:
          - step: node-get
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: talosconfig
        description: A fresh talosconfig, so the Talos model's targets include the new node.
        task:
          type: model_method
          modelIdOrName: omni
          methodName: talosconfig
          inputs:
            cluster: ${{ inputs.cluster }}
        dependsOn:
          - step: node-ready
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: volumes
        description: The new node's disk layout.
        task:
          type: model_method
          modelIdOrName: dataverket-prod-talos
          methodName: volumes
          inputs:
            nodes:
              - ${{ data.latest("openstack-server", "server-" + inputs.name).attributes.addresses[inputs.network][0] }}
        dependsOn:
          - step: talosconfig
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: layout
        description: EPHEMERAL and the user volume at exactly the sizes the patch states.
        task:
          type: assert
          expr: >-
            data.findBySpec("dataverket-prod-talos", "volumeLayout").exists(r, r.tags.?workflowRunId.orValue("") == run.id && r.attributes.hostname == inputs.name
            && int(r.attributes.ephemeralSizeBytes) == inputs.ephemeralGiB * 1073741824
            && r.attributes.partitions.exists(p, p.label == "u-" + inputs.userVolume
            && int(p.sizeBytes) == inputs.userVolumeGiB * 1073741824))
          message: >-
            ${{ inputs.name }}'s disk is not laid out as the patch states (EPHEMERAL ${{ inputs.ephemeralGiB }} GiB,
            u-${{ inputs.userVolume }} ${{ inputs.userVolumeGiB }} GiB); see this run's volumeLayout record. A disk
            Talos has laid out is not changed in place: retire the machine with worker-retire.
          severity: high
        dependsOn:
          - step: volumes
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn:
      - job: join
        condition:
          type: succeeded
    weight: 0
version: 1
