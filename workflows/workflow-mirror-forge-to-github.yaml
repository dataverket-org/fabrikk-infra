id: bb607f5b-20cc-494d-963e-e8fbb2a1a69b
name: mirror-forge-to-github
description: >-
  Mirror every repository of the dataverket org on git.dataverket.org to the dataverket-org org on GitHub, with
  both tokens from the infra vault. This file holds only our values: the work is done by
  @dataverket/mirror-forgejo-to-github from the @dataverket/forgejo-github-mirror extension, whose description
  and README say what a run does and what it never does. Run it by hand whenever a repository was added on the
  forge, or as a periodic check; it changes nothing that is already right, never deletes anything on GitHub, and
  fails when a mirror reports a push error or a private repository has a public twin. The data lands in the
  models mirror-forgejo-to-github-forgejo and mirror-forgejo-to-github-github.
tags:
  factory: forge
version: 1
jobs:
  - name: mirror
    steps:
      - name: dataverket-to-github
        description: git.dataverket.org/dataverket to github.com/dataverket-org, tokens named in the infra vault.
        task:
          type: workflow
          workflowIdOrName: "@dataverket/mirror-forgejo-to-github"
          inputs:
            forgejoUrl: https://git.dataverket.org
            forgejoOwner: dataverket
            forgejoTokenVault: infra
            forgejoTokenKey: forgejo/api_token
            githubOwner: dataverket-org
            githubTokenVault: infra
            githubTokenKey: github/mirror_token
