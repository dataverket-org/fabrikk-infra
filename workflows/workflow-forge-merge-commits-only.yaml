id: f8e6ecd4-c8f1-499a-b6b5-db86437172b6
name: forge-merge-commits-only
description: >-
  A repository on the forge merges pull requests only with a merge commit, so the commits a pull request carries
  reach the branch as they were pushed: signed, and with any attestation tag on its commit still true. A rebase, a
  rebase with a merge commit and a squash each make new, unsigned commits on the forge, and "Update branch by rebase"
  rewrites a pull request's head before the merge, so all four are turned off; merge is the button's default.
  The branch's protection rule stops requiring an up-to-date branch (blockOnOutdatedBranch), which forced an update
  before every merge that followed another. Run on demand for a repository whose pull requests carry attestations;
  dataverket/fabrikk is the first (docs/plans/2026-11-forge-merge-settings.md).
  The first step only reads, and records what the repository had before. A repository with pull requests off is
  refused with nothing sent. A branch without a protection rule is left without one: that step runs only when the
  rule exists and requires an up-to-date branch. "Update branch by merge" stays: it keeps the attested commit but
  moves the head, and fabrikk notices that and stops for a person. Settings not named here are left as they are.
  Runs with the forgejo definition's token. Afterwards, the record repo-merge-settings-<owner>-<name> of forgejo
  shows the settings in force, read back from the forge.
tags:
  factory: platform
inputs:
  properties:
    owner:
      type: string
      default: dataverket
      description: The organization or user that owns the repository
    name:
      type: string
      description: The repository, e.g. fabrikk
    branch:
      type: string
      default: main
      description: The branch whose protection rule stops requiring an up-to-date branch
  required:
    - name
jobs:
  - name: merge-settings
    description: The merge settings read, converged and read back, then the branch rule.
    steps:
      - name: before
        description: The repository's merge settings as they are, read and recorded before anything changes.
        task:
          type: model_method
          modelIdOrName: forgejo
          methodName: repo_merge_settings_ensure
          inputs:
            owner: ${{ inputs.owner }}
            name: ${{ inputs.name }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: merge-commits-only
        description: >-
          Merge commits on and the default; rebase, rebase with a merge commit, squash and update by rebase off. Only
          the settings that differ are sent, and the forge's answer is checked.
        task:
          type: model_method
          modelIdOrName: forgejo
          methodName: repo_merge_settings_ensure
          inputs:
            owner: ${{ inputs.owner }}
            name: ${{ inputs.name }}
            allowMergeCommits: true
            defaultMergeStyle: merge
            allowRebase: false
            allowRebaseExplicit: false
            allowSquashMerge: false
            allowRebaseUpdate: false
        dependsOn:
          - step: before
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: merge-commits-only-in-force
        description: The forge reports the six settings, read back after the write.
        task:
          type: assert
          expr: >-
            data.latest("forgejo", "repo-merge-settings-" + inputs.owner + "-" + inputs.name).attributes.allowMergeCommits == true &&
            data.latest("forgejo", "repo-merge-settings-" + inputs.owner + "-" + inputs.name).attributes.defaultMergeStyle == "merge" &&
            data.latest("forgejo", "repo-merge-settings-" + inputs.owner + "-" + inputs.name).attributes.allowRebase == false &&
            data.latest("forgejo", "repo-merge-settings-" + inputs.owner + "-" + inputs.name).attributes.allowRebaseExplicit == false &&
            data.latest("forgejo", "repo-merge-settings-" + inputs.owner + "-" + inputs.name).attributes.allowSquashMerge == false &&
            data.latest("forgejo", "repo-merge-settings-" + inputs.owner + "-" + inputs.name).attributes.allowRebaseUpdate == false
          message: >-
            ${{ inputs.owner }}/${{ inputs.name }} does not report merge commits only:
            ${{ data.latest("forgejo", "repo-merge-settings-" + inputs.owner + "-" + inputs.name).attributes }}
          severity: high
        dependsOn:
          - step: merge-commits-only
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: protection-rules
        description: The repository's branch protection rules, read, so the next step sees the rule as it is now.
        task:
          type: model_method
          modelIdOrName: forgejo
          methodName: branch_protection_list
          inputs:
            owner: ${{ inputs.owner }}
            name: ${{ inputs.name }}
        dependsOn:
          - step: merge-commits-only-in-force
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: no-outdated-branch-block
        description: >-
          The branch's rule stops requiring an up-to-date branch, that field alone sent. Skipped when the rule does not
          require it, and when there is no rule, so no rule is ever created here.
        guard: >-
          ${{ !(data.latest("forgejo", "branch-protection-" + inputs.owner + "-" + inputs.name + "-" + inputs.branch).?attributes.?blockOnOutdatedBranch.orValue(false)) }}
        task:
          type: model_method
          modelIdOrName: forgejo
          methodName: branch_protection_ensure
          inputs:
            owner: ${{ inputs.owner }}
            name: ${{ inputs.name }}
            rule: ${{ inputs.branch }}
            blockOnOutdatedBranch: false
        dependsOn:
          - step: protection-rules
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: no-outdated-branch-block-in-force
        description: The branch's rule, if there is one, does not require an up-to-date branch.
        task:
          type: assert
          expr: >-
            !(data.latest("forgejo", "branch-protection-" + inputs.owner + "-" + inputs.name + "-" + inputs.branch).?attributes.?blockOnOutdatedBranch.orValue(false))
          message: >-
            The ${{ inputs.branch }} rule of ${{ inputs.owner }}/${{ inputs.name }} still requires an up-to-date branch.
          severity: high
        dependsOn:
          - step: no-outdated-branch-block
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: protection-rules
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
