id: d961f9b1-c4a6-4ebe-8654-4f7faf498591
name: renovate-image-verified
description: >-
  Is this Renovate image the one Renovate's own CI built and signed, from Renovate's own repository? Run it when
  the tag pinned in the renovate repository's kube/cronjob.yaml changes, before the image is used. One step: it
  calls @dataverket/verified-upstream-image (from @dataverket/signed-images) with the identity and issuer that
  renovate-signing-identity states, the provenance type slsaprovenance1 and Renovate's repository as the source
  the provenance must name. That workflow resolves the tag to its digest once, verifies the signature of that
  digest keyless through the public Sigstore log, then its SLSA provenance, and fails with what to look at.
  Read-only: it reads ghcr.io and Sigstore and writes three records, digest (verified-upstream-image-crane),
  verification and attestationVerification (verified-upstream-image-cosign). crane and cosign read ghcr.io with
  the container config of the user running swamp; a public image needs no login. What a pass proves: the digest
  was built and signed by that workflow, from that repository. What it does not: that the commit it was built
  from is good, or that a cluster runs this digest, since the CronJob pulls by tag and nothing verifies there.
tags:
  factory: platform
version: 1
inputs:
  additionalProperties: false
  properties:
    ref:
      type: string
      description: The image by tag, with its registry, such as ghcr.io/renovatebot/renovate:44.226.2
  required:
    - ref
jobs:
  - name: verify
    steps:
      - name: upstream
        description: The signature and the SLSA provenance of the digest behind ref, against Renovate's signing identity and source repository.
        task:
          type: workflow
          workflowIdOrName: "@dataverket/verified-upstream-image"
          inputs:
            ref: ${{ inputs.ref }}
            certificateIdentity: ${{ model.renovate-signing-identity.input.globalArguments.certificateIdentity }}
            oidcIssuer: ${{ model.renovate-signing-identity.input.globalArguments.oidcIssuer }}
            attestationType: slsaprovenance1
            sourceRepository: https://github.com/renovatebot/renovate
