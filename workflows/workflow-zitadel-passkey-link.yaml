id: 9d2e4f61-8b7a-4c35-a1d0-6e5f3b2c9a84
name: zitadel-passkey-link
description: >-
  Mail one person a passkey registration link for Zitadel's name, id.dataverket.org (decision 031). Run on demand by an
  operator, for one user at a time, when that person says they are ready. The code in the link lives as long as
  the hours input says, two days unless told otherwise and never more than that: the first step sets that
  lifetime on the instance's passkey code generator, for every link made until it is set again, and the mail
  goes only once the generator reports it. The person opens the link, registers a passkey on that name without
  logging in first, and logs in there with it; a passkey binds to the host it is made on, so this is how an
  account gets a passkey for a name it has none for, and how a person who missed a link gets in. Zitadel sends the
  mail itself, from noreply@dataverket.org, with its own "Add Passkey Login" text; nothing of the code passes
  through here.
  Both steps run as you: task admin:zitadel-login writes your own login to the file that zitadel-settings-me and
  zitadel-me name, Zitadel's audit log carries your name, and a run without that file fails at once and changes
  nothing (decision 033). The lifetime needs iam.write, the IAM_OWNER role. Zitadel refuses a machine user, so a
  service account cannot be mailed by mistake. Run it again for the same person if the time passed: a new code
  replaces the old. Afterwards, swamp behavior run zitadel-user authFactorList --arg user=<login name> shows the
  new passkey.
tags:
  factory: platform
version: 2
inputs:
  properties:
    user:
      type: string
      description: The person's login name, e.g. someone@example.org, or their user id
    hours:
      type: integer
      default: 48
      description: How many hours the code in the link stays valid, 1 to 48
  required:
    - user
jobs:
  - name: mail
    steps:
      - name: hours-within-two-days
        description: The lifetime asked for is between one hour and two days; a longer one is refused before anything changes.
        task:
          type: assert
          expr: >-
            inputs.hours >= 1 && inputs.hours <= 48
          message: "hours must be between 1 and 48, not ${{ inputs.hours }}"
          severity: high
      - name: lifetime
        description: >-
          The passkey code generator's expiry set to the hours asked for, its length and character set kept; a value
          already in force is reported as unchanged.
        dependsOn:
          - step: hours-within-two-days
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: zitadel-settings-me
          methodName: secretGeneratorSet
          inputs:
            generator: passwordlessInitCode
            expirySeconds: ${{ inputs.hours * 3600 }}
      - name: lifetime-in-force
        description: Zitadel reports the lifetime asked for, read back after the write.
        dependsOn:
          - step: lifetime
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.latest("zitadel-settings-me", "secret-generator-passwordlessinitcode").attributes.expirySeconds == inputs.hours * 3600
          message: >-
            The passkey code generator does not report ${{ inputs.hours }} hours: ${{ data.latest("zitadel-settings-me", "secret-generator-passwordlessinitcode").attributes }}
          severity: high
      - name: link
        description: One registration link, mailed by Zitadel to the person's verified address, pointing at the new name.
        dependsOn:
          - step: lifetime-in-force
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: zitadel-me
          methodName: passkeyRegistrationLinkCreate
          inputs:
            user: ${{ inputs.user }}
            delivery: email
            urlTemplate: "https://id.dataverket.org/ui/v2/login/passkey/set?codeId={{.CodeID}}&code={{.Code}}&userId={{.UserID}}&organization={{.OrgID}}"
