apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nordhost-webhook-ca
  namespace: cert-manager
spec:
  secretName: nordhost-webhook-ca
  duration: 43800h # 5y
  issuerRef:
    name: nordhost-webhook-selfsign
  commonName: "ca.nordhost-webhook.cert-manager"
  isCA: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nordhost-webhook-webhook-tls
  namespace: cert-manager
spec:
  secretName: nordhost-webhook-webhook-tls
  duration: 8760h # 1y
  issuerRef:
    name: nordhost-webhook-ca
  dnsNames:
  - nordhost-webhook
  - nordhost-webhook.cert-manager
  - nordhost-webhook.cert-manager.svc

---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: nordhost-webhook-selfsign
  namespace: cert-manager
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: nordhost-webhook-ca
  namespace: cert-manager
spec:
  ca:
    secretName: nordhost-webhook-ca
