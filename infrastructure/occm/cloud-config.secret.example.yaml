# Not applied by Flux (deliberately excluded from kustomization.yaml).
#
# OCCM needs a Secret named "cloud-config" in kube-system with a "cloud.conf"
# key holding real OpenStack credentials. Fill in the values below and apply
# it out-of-band, e.g.:
#
#   kubectl apply -f cloud-config.secret.example.yaml
#
# or generate it from real values without ever writing plaintext to disk:
#
#   kubectl -n kube-system create secret generic cloud-config \
#     --from-file=cloud.conf=./cloud.conf
#
apiVersion: v1
kind: Secret
metadata:
  name: cloud-config
  namespace: kube-system
type: Opaque
stringData:
  cloud.conf: |
    [Global]
    auth-url=https://CHANGEME:5000/v3
    application-credential-id=CHANGEME
    application-credential-secret=CHANGEME
    region=CHANGEME

    [LoadBalancer]
    subnet-id=CHANGEME
    floating-network-id=CHANGEME
