# S3 metadata travels as x-amz-meta-<name> headers, and S3 clients use underscores in those names: Zulip's avatars
# carry x-amz-meta-user_profile_id. Envoy rejects a header name with an underscore by default, so the S3 listener
# allows them; every other listener keeps the default (decision 029).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: s3-osl1-underscores
  namespace: envoy-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
      sectionName: https-s3-osl1
  headers:
    withUnderscoresAction: Allow
  # As clienttrafficpolicy.yaml; a listener's own policy replaces the Gateway's.
  proxyProtocol:
    optional: true
