# The data plane for GatewayClass envoy: one proxy per worker, as a DaemonSet (decision 024).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy
  namespace: envoy-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDaemonSet:
        # One worker at a time.
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
        container:
          # Five times the measured working set (decision 024).
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local
        # Every public name points at this floating IP. A new load balancer reuses it, and deleting one keeps it.
        loadBalancerIP: 91.242.200.101
        # Octavia sends each connection's client address in a PROXY v2 header, on every listener, so X-Forwarded-For
        # names the visitor (clienttrafficpolicy.yaml); without it the load balancer's own address is all Envoy sees.
        annotations:
          loadbalancer.openstack.org/proxy-protocol: "v2"
          loadbalancer.openstack.org/keep-floatingip: "true"
