# The data plane for GatewayClass envoy: one proxy per worker, as a DaemonSet (decision 024).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy
  namespace: envoy-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDaemonSet:
        # One worker at a time.
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
        container:
          # Five times the measured working set (decision 024).
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local
