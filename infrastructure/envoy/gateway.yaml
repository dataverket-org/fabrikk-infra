apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-gateway
  namespace: envoy-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: envoy
  listeners:
    - name: ssh
      protocol: TCP
      port: 22
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.dataverket.org"
      tls:
        mode: Terminate
        certificateRefs:
          - name: dataverket-org-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-dataverket-org
      protocol: HTTPS
      port: 443
      hostname: "dataverket.org"
      tls:
        mode: Terminate
        certificateRefs:
          - name: dataverket-org-tls
      allowedRoutes:
        namespaces:
          from: All
    # The S3 service at the osl1 site; the org is the leftmost label under the wildcard (decision 029).
    # The certificate comes from the annotation above, through DNS-01 on dvkt.no.
    - name: https-s3-osl1
      protocol: HTTPS
      port: 443
      hostname: "*.s3.osl1.dvkt.no"
      tls:
        mode: Terminate
        certificateRefs:
          - name: s3-osl1-dvkt-no-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    # Zitadel's site alias, id.osl1.dvkt.no, under the naming rule of decision 031; id.dataverket.org, the name
    # people bind to, is covered by the wildcard listener above. One name and not a wildcard: a Gateway API
    # wildcard spans more than one label and would overlap https-s3-osl1 on this port. The certificate comes
    # from the annotation above, through DNS-01 on dvkt.no.
    - name: https-id-osl1
      protocol: HTTPS
      port: 443
      hostname: "id.osl1.dvkt.no"
      tls:
        mode: Terminate
        certificateRefs:
          - name: id-osl1-dvkt-no-tls
      allowedRoutes:
        namespaces:
          from: All
