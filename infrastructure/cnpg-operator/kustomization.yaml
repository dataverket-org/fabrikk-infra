# CloudNativePG 1.30.0, the release manifest kept here (decision 035): bin/vendor fetched it from
# https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.30/releases/cnpg-1.30.0.yaml and
# share/vendor.sh pins its SHA-256, so a Flux build needs nothing from GitHub. Bump: the row in share/vendor.sh,
# then bin/vendor.
resources:
  - cnpg-1.30.0.yaml
# Step 1 of the move into an artifact (docs/plans/2026-11-gitless.md, goal 2): Flux must not garbage-collect
# these when they leave this Kustomization for their own; removed again once the artifact owns them.
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
