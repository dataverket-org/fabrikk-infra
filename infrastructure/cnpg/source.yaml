# CloudNativePG and its Barman plugin, delivered gitless from artifacts/cnpg (decisions 013, 035; the gitless plan).
# Every database Cluster depends on this Kustomization, by name, in its own artifact's pointer.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cnpg-config
  namespace: flux-system
spec:
  interval: 10m
  url: oci://zot.zot.svc.cluster.local:5000/platform/cnpg-config
  insecure: true
  ref:
    tag: current
  # Verification, switched on in goal 3 of the gitless plan, once every artifact is pushed signed:
  # verify:
  #   provider: cosign
  #   secretRef:
  #     name: cosign-osl1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: zot
  sourceRef:
    kind: OCIRepository
    name: cnpg-config
  path: ./
  prune: true
  wait: true
  timeout: 5m
