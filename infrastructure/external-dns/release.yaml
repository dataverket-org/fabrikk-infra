apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: cert-manager
spec:
  chart:
    spec:
      chart: external-dns
      version: 1.21.1
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  interval: 1h
  # The release is being handed to the rendered artifact (infrastructure/cert-manager/source.yaml). When this
  # HelmRelease is removed, helm-controller uninstalls with orphan: the objects stay and Flux keeps applying them.
  uninstall:
    deletionPropagation: orphan
    keepHistory: false
  releaseName: external-dns
  targetNamespace: cert-manager
  values:
    # Placement, decision 027: on the control planes with the DNS credential,
    # one replica; external-dns has no leader election, so never more.
    priorityClassName: system-cluster-critical
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
    sources:
      - service
      - gateway-httproute
    provider:
      name: webhook
      webhook:
        image:
          # Temporary image for early testing; to move to a permanent home.
          repository: docker.io/eskpil/nordhost-externaldns-webhook
          tag: latest
        env:
          - name: CONFIG
            value: /etc/nordhost/config.json
        extraVolumeMounts:
          - name: nordhost-config
            mountPath: /etc/nordhost
            readOnly: true
    # The DirectAdmin credentials Secret shared with nordhost-webhook.
    extraVolumes:
      - name: nordhost-config
        secret:
          secretName: nordhost-config
