# cert-manager, external-dns, the nordhost webhook and the ClusterIssuer are delivered gitless, rendered in the
# factory from artifacts/cert-manager/recipe (README "Gitless delivery", decision 028). Fetched through the Service,
# plain HTTP. Until the HelmReleases in this directory are removed, both paths apply the same objects; the handover
# is artifacts/cert-manager/README.md.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager-config
  namespace: flux-system
spec:
  interval: 10m
  url: oci://zot.zot.svc.cluster.local:5000/platform/cert-manager-config
  insecure: true
  ref:
    tag: current
  # Verification, switched on after this artifact has been pushed signed once with the site key
  # (vaults/operator/README.md, "Signing keys"; clusters/production/cosign-osl1.yaml holds the public half):
  # verify:
  #   provider: cosign
  #   secretRef:
  #     name: cosign-osl1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: zot
  sourceRef:
    kind: OCIRepository
    name: cert-manager-config
  path: ./
  prune: true
  wait: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
