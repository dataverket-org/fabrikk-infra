# The Barman Cloud plugin for CloudNativePG v0.15.0, the release manifest kept here (decision 035): bin/vendor
# fetched it from https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.15.0/manifest.yaml
# and share/vendor.sh pins its SHA-256, so a Flux build needs nothing from GitHub (backup/README.md). Bump: the
# row in share/vendor.sh, then bin/vendor.
resources:
  - plugin-barman-cloud-v0.15.0.yaml
# Step 1 of the move into an artifact (docs/plans/2026-11-gitless.md, goal 2): Flux must not garbage-collect
# these when they leave this Kustomization for their own; removed again once the artifact owns them.
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
