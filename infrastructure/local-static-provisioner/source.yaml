# The local static provisioner, delivered gitless from artifacts/local-static-provisioner (decisions 013, 028; the
# gitless plan, goal 2). It publishes the workers' pg-zitadel partitions as local PVs behind the StorageClass
# pg-zitadel-storage, which travels in the artifact.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: local-static-provisioner-config
  namespace: flux-system
spec:
  interval: 10m
  url: oci://zot.zot.svc.cluster.local:5000/platform/local-static-provisioner-config
  insecure: true
  ref:
    tag: current
  # Verification, switched on in goal 3 of the gitless plan, once every artifact is pushed signed:
  # verify:
  #   provider: cosign
  #   secretRef:
  #     name: cosign-osl1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-static-provisioner
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: zot
  sourceRef:
    kind: OCIRepository
    name: local-static-provisioner-config
  path: ./
  prune: true
  wait: true
  timeout: 5m
