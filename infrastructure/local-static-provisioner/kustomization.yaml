# Handover to the artifact (artifacts/cert-manager/README.md "Handing over", step 0): source.yaml is the pointer; the
# HelmRelease, its repository and the StorageClass stay here until the local-static-provisioner Kustomization has
# adopted the objects, then a second commit removes them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - source.yaml
  - repo.yaml
  - storageclass.yaml
  - release.yaml
