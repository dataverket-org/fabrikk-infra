apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-static-provisioner
  namespace: kube-system
spec:
  chart:
    spec:
      chart: local-static-provisioner
      version: 2.8.0
      sourceRef:
        kind: HelmRepository
        name: sig-storage-local-static-provisioner
        namespace: flux-system
  interval: 1h
  releaseName: local-static-provisioner
  # Handover to the rendered artifact (docs/plans/2026-11-gitless.md, goal 2; the recipe is
  # artifacts/cert-manager/README.md "Handing over"): one last upgrade marks every object keep, so Helm's
  # uninstall leaves them to the local-static-provisioner Kustomization when this HelmRelease goes.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ".*"
            patch: |-
              apiVersion: v1
              kind: Placeholder
              metadata:
                name: placeholder
                annotations:
                  helm.sh/resource-policy: keep
  targetNamespace: kube-system
  values:
    classes:
      # Every worker's u-pg-zitadel partition, which Talos mounts at /var/mnt/pg-zitadel
      # (talos/dataverket-prod/workers-storage.yaml). Only that mount, so a later user volume is not published here.
      - name: pg-zitadel-storage
        hostDir: /var/mnt
        namePattern: pg-zitadel
        volumeMode: Filesystem
        accessMode: ReadWriteOnce
        storageClass: false
    # Talos labels control planes and not workers, so the DaemonSet is kept off by that label.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
