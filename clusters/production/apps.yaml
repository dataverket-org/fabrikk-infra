apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    # The database operator comes from its own artifact; Forgejo's and Zitadel's Clusters need its CRDs.
    - name: cnpg
  interval: 10m
  path: ./apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Secrets are committed encrypted (*.enc.yaml, see .sops.yaml) and decrypted here with the cluster's own key.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
