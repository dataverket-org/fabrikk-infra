# The values that make this cluster this site (decision 034): substituted by Flux into the Kustomizations that
# apply artifacts carrying image references (apps/{www,offentlig-data,zulip}/source.yaml), so a site's manifests
# say registry.${SITE}.dvkt.no and the same artifact serves another site from its own mirror. This file is what an
# overlay repository takes over when there is one. Not applied to apps/, whose Zitadel values carry ${...} of
# their own for Zitadel to read.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
data:
  SITE: osl1
