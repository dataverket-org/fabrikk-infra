# Restore test for zitadel-db: a scratch cluster recovered from the hov1 archive, writing nothing back
# (backup/cnpg-backups.md, "Restore").
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-db-restore-test
  namespace: zitadel
  labels:
    dataverket.org/purpose: restore-test
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  storage:
    size: 5Gi
  bootstrap:
    recovery:
      source: hov1-archive
      database: zitadel
      owner: zitadel
  externalClusters:
    - name: hov1-archive
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: hov1
          serverName: zitadel-db-2
