# An S3 endpoint from one directory: versitygw with the posix backend, behind a certificate from the site's own
# private CA. The CA is four files made once by bin/cert (step, offline, three years); nothing else runs. This file
# names no site: every value comes from the site's .env, and the site's compose.yaml includes this one with the site
# directory as project directory, so ./certs below is the site's certs. Needs Docker Compose 2.24 or newer (include).

services:
  versitygw:
    image: versity/versitygw:v1.8.0
    container_name: ${SITE:?set in .env}-versitygw
    restart: unless-stopped
    # versitygw does not reap children, and every healthcheck leaves one (busybox wget's ssl_client); an init as
    # pid 1 does the reaping.
    init: true
    command:
      - --port=:7070
      - --cert=/certs/tls.crt
      - --key=/certs/tls.key
      - --iam-dir=/iam
      - --region=${REGION:?set in .env}
      - --health=/health
      # The admin API (create-user and friends) is a separate plain-HTTP listener; it is never published, and
      # bin/user talks to it from inside this container.
      - --admin-port=:7071
      - posix
      - --versioning-dir=/versions
      - /data
    environment:
      ROOT_ACCESS_KEY: ${ROOT_ACCESS_KEY:?set in .env}
      ROOT_SECRET_KEY: ${ROOT_SECRET_KEY:?set in .env}
    ports:
      - "${LISTEN:-0.0.0.0}:${PORT:-443}:7070"
    volumes:
      - ${DATA_DIR:?set in .env}:/data
      - ${VERSIONS_DIR:?set in .env}:/versions
      - iam:/iam
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1:7070/health"]
      interval: 1m

volumes:
  iam:
