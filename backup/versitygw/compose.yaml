# The versitygw stack: one gateway behind the site's private CA; a site includes this file with its own .env and
# certs (README.md).

services:
  versitygw:
    image: versity/versitygw:v1.8.0
    container_name: ${SITE:?set in .env}-versitygw
    # always, not unless-stopped: rootless Podman's podman-restart.service starts only containers marked always
    # after a reboot, and a stopped gateway is a backup target that silently fills every database's WAL.
    restart: always
    # An init reaps the healthcheck's children.
    init: true
    command:
      - --port=:7070
      - --cert=/certs/tls.crt
      - --key=/certs/tls.key
      - --iam-dir=/iam
      - --region=${REGION:?set in .env}
      - --health=/health
      # The admin API, on the host's loopback only (README.md).
      - --admin-port=:7071
      - posix
      - --versioning-dir=/versions
      - /data
    environment:
      ROOT_ACCESS_KEY: ${ROOT_ACCESS_KEY:?set in .env}
      ROOT_SECRET_KEY: ${ROOT_SECRET_KEY:?set in .env}
    ports:
      - "${LISTEN:-0.0.0.0}:${PORT:-443}:7070"
      - "${ADMIN_LISTEN:-127.0.0.1}:${ADMIN_PORT:-7071}:7071"
    volumes:
      - ${DATA_DIR:?set in .env}:/data
      - ${VERSIONS_DIR:?set in .env}:/versions
      - iam:/iam
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1:7070/health"]
      interval: 1m

volumes:
  iam:
