# zot from git, for bootstrap and recovery only; applied and removed by bootstrap.sh (decision 011). No prune.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zot-bootstrap
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./artifacts/zot
  prune: false
  wait: true
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
