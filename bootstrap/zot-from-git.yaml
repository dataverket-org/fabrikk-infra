# zot from git, for bootstrap and recovery only. Applied and later removed by bootstrap.sh.
#
# In steady state zot's config comes from zot itself (apps/zot/source.yaml). Before zot exists, and whenever a bad
# artifact leaves it unable to serve, this Kustomization applies the same directory straight from git. It has no
# prune, so deleting it leaves zot running. See docs/decisions/003-zot-config-self-hosted-git-fallback.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zot-bootstrap
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./artifacts/zot
  prune: false
  wait: true
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
