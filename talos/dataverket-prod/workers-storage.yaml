# The workers' disk layout and kubelet budget (decisions 014, 017 and 019; the state in docs/storage.md). Applied
# through Omni as a ConfigPatch by `omni-cluster applyPatch`, with this file as its data: to each new worker before
# it joins (worker-join), scoped to that machine, and on the machine set dataverket-prod-workers as 500-workers-storage.
# Never to a running worker: Talos sizes volumes only when it first provisions a machine. Outside clusters/, so Flux
# never reads it. Talos 1.14.
#
# Both volumes share the system disk, and Talos does not promise which it lays out first, so each states its size
# with minSize equal to maxSize (decision 019). Of the 30 GiB disk, 26,615 MiB is free for volumes; 14 GiB and
# 11 GiB fit in either order, about 1 GiB left. A node with a data disk of its own gives pg-zitadel that disk instead.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  minSize: 14GiB
  maxSize: 14GiB
  grow: false
---
# Zitadel's database; the static provisioner publishes its mount as a local PV of class pg-zitadel-storage.
# system_disk keeps Talos off the Cinder volumes attached to the same machine.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: pg-zitadel
provisioning:
  diskSelector:
    match: system_disk
  minSize: 11GiB
  maxSize: 11GiB
  grow: false
filesystem:
  type: xfs
---
# Image collection from 80 percent of EPHEMERAL, images unused for a week collected anyway, logs capped per
# container. evictionHard is written out in full, the kubelet's defaults included, since a partial map may replace
# them rather than merge.
machine:
  kubelet:
    extraConfig:
      imageGCHighThresholdPercent: 80
      imageGCLowThresholdPercent: 70
      imageMaximumGCAge: 168h
      containerLogMaxSize: 20Mi
      evictionHard:
        memory.available: 100Mi
        nodefs.available: 1Gi
        nodefs.inodesFree: 5%
        imagefs.available: 2Gi
        imagefs.inodesFree: 5%
