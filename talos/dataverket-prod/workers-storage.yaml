# The workers' disk layout and kubelet budget (docs/plans/2026-09-storage-building-blocks.md, step 4; decision 014).
# Applied through Omni as a ConfigPatch by `omni-cluster applyPatch`, with this file as its data: to each new
# worker before it joins, scoped to that machine, and after the third swap to the machine set dataverket-prod-workers.
# Never to a running worker: Talos sizes volumes only when it first provisions a machine. Outside clusters/, so Flux
# never reads it. Talos 1.14.
#
# EPHEMERAL is capped at 16 GiB, so the kubelet's percentages are a budget and not a share of whatever the disk is.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  maxSize: 16GiB
---
# The rest of the system disk, about 12 GiB on a 30 GiB m5.large, for Zitadel's database; the static provisioner
# publishes its mount as a local PV of class pg-zitadel-storage. system_disk keeps Talos off the Cinder volumes
# attached to the same machine.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: pg-zitadel
provisioning:
  diskSelector:
    match: system_disk
  minSize: 6GiB
  grow: true
filesystem:
  type: xfs
---
# Image collection from 80 percent of EPHEMERAL, images unused for a week collected anyway, logs capped per
# container. evictionHard is written out in full, the kubelet's defaults included, since a partial map may replace
# them rather than merge.
machine:
  kubelet:
    extraConfig:
      imageGCHighThresholdPercent: 80
      imageGCLowThresholdPercent: 70
      imageMaximumGCAge: 168h
      containerLogMaxSize: 20Mi
      evictionHard:
        memory.available: 100Mi
        nodefs.available: 1Gi
        nodefs.inodesFree: 5%
        imagefs.available: 2Gi
        imagefs.inodesFree: 5%
