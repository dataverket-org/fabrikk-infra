# The workers' disk layout and kubelet budget: docs/storage.md, "The workers"; decisions 014, 017 and 019. Applied by
# omni-cluster applyPatch to a machine before it joins, and on the machine set as 500-workers-storage. Outside
# clusters/, so Flux never reads it. Talos 1.14.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  minSize: 14GiB
  maxSize: 14GiB
  grow: false
---
# Zitadel's database; the static provisioner publishes its mount as a local PV of class pg-zitadel-storage.
# system_disk keeps Talos off the Cinder volumes attached to the same machine.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: pg-zitadel
provisioning:
  diskSelector:
    match: system_disk
  minSize: 11GiB
  maxSize: 11GiB
  grow: false
filesystem:
  type: xfs
---
# The kubelet budget (docs/storage.md).
machine:
  kubelet:
    extraConfig:
      imageGCHighThresholdPercent: 80
      imageGCLowThresholdPercent: 70
      imageMaximumGCAge: 168h
      containerLogMaxSize: 20Mi
      evictionHard:
        memory.available: 100Mi
        nodefs.available: 1Gi
        nodefs.inodesFree: 5%
        imagefs.available: 2Gi
        imagefs.inodesFree: 5%
