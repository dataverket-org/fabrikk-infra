version: '3'

#
# The admin session, tier 1 of decision 001: every task runs as you, with your
# own Omni, OpenStack and Zitadel logins, and writes only the tier 2 files the
# README's Commands section lists. None reads or writes the swamp vault, and
# none needs swamp on PATH.
#
# What `task --list` shows is what a person driving this repository does:
# look (`task admin`), start the working day (`admin:start`), take the keys
# that can change things when about to (`admin:elevate`), and end it
# (`admin:stop`), plus two rare jobs. The steps behind them have no desc, so
# the list leaves them out, and each still runs alone by name.
#
# Settings are environment variables, not options (decision 008):
#
#	OPERATOR	You, in the names a provider records (default $USER); a
#			file name or a kube context never carries it
#	RENEW=1		Renew every item of ours now, not only when due
#	DEBUG=1		Print every external command before it runs
#	TIER2_TTL=8h	The one lifetime of every tier 2 item, whole hours
#	OS_CLOUD	The clouds.yaml entry you log in with; when it is unset,
#			the one entry that reaches our Keystone is found
#	OS_PASSWORD_REF	Where your OpenStack password lives: pass:// (Proton
#			Pass), passstore:// (passwordstore.org) or sops://FILE#FIELD
#			(share/secrets.sh); set below, yours wins
#	OS_PASSWORD	Your OpenStack password itself; set, no reference is read
#
# A task that needs a secret names it in front of its command, as
# `bin/with-secrets NAME -- bin/<script>`, and finds it in NAME_REF: the
# password manager is the wrapper's business, never the script's.
#
# What this repository administers is set below and nowhere else; the scripts
# require every value and default none. A shell that exports one wins for that
# run. The three logins are names in your own config files, never addresses
# (decision 009); where they answer is in the README.
#

# Every script names what it works on, so task's own echo of the command
# would only repeat it.
silent: true

env:
  # One id for every script a task invocation runs, so admin:start is one run
  # in the log (share/logging.sh).
  LOG_RUN: { sh: date -u +%Y%m%dT%H%M%SZ }
  SWAMP_REPO: fabrikk-infra
  CLUSTER: dataverket-prod
  OMNI_CONTEXT: default
  OS_CLOUD: nexthop
  # Where the OpenStack password for OS_CLOUD lives, by name: the login item
  # Proton Pass saves from the cloud's web console, in its default vault. A
  # reference, never the secret. Export your own if yours is elsewhere, e.g.
  # passstore://nexthop/openstack or sops://~/.config/fabrikk/nexthop.enc.yaml.
  OS_PASSWORD_REF: pass://Personal/cloud.nexthop.no/password
  # The roles the session's application credential carries: member for compute and networks, and Octavia's own
  # load-balancer_member, without which the load balancer in front of Envoy cannot be read or repaired.
  OS_ROLES: member load-balancer_member
  ZITADEL_CONTEXT: default
  # The projects the Zitadel operator key owns, and so the whole of what it can
  # change. The first holds the application these tasks log in through.
  ZITADEL_PROJECTS: fabrikk-infra-admin zulip
  ZITADEL_ORG: Operators
  ZITADEL_NAMESPACE: zitadel
  # The zones whose Nordhost login keys the cluster holds, in
  # artifacts/cert-manager/nordhost-config.enc.yaml, and the name the keys
  # carry in Nordhost's panel before their expiry date. The cluster reaches
  # Nordhost from 91.242.200.102, its router's address (infra1-gw, SNAT).
  NORDHOST_ZONES: dataverket.org dvkt.no
  NORDHOST_KEY_PREFIX: dataverketprod

tasks:
  default:
    desc: "What you hold now, and whether anything needs doing"
    aliases: [status]
    cmds: [bin/status]

  start:
    desc: "Log in and bring every credential current; RENEW=1 renews all of them now"
    cmds:
      - bin/login
      - task: renew
      - echo ">>> Ready. task admin shows what you hold; task admin:stop ends the day"

  elevate:
    desc: "Keys that can change things: Omni Operator and Zitadel operator, until admin:stop"
    cmds:
      - task: omni-operator-key
      - task: zitadel-operator-key

  stop:
    desc: "Log out and remove the keys that can change things; the rest expires by itself"
    cmds: [bin/logout]

  dns-keys:
    desc: "New Nordhost DNS keys for the cluster's zones; DRY_RUN=1 only tests the current ones"
    cmds:
      - for: { var: NORDHOST_ZONES, split: ' ' }
        task: nordhost-key
        vars: { NORDHOST_ZONE: '{{.ITEM}}' }

  zitadel-setup:
    desc: "Once per Zitadel instance: its organization's name, the admin project, the login app"
    cmds: [bin/zitadel-bootstrap]

  # The steps. renew asks bin/due once and hands the answer to every item, so
  # the whole of tier 2 is renewed together and expires together.

  renew:
    vars:
      RENEW: { sh: bin/due }
    cmds:
      # Before any credential is minted: the encrypted files in this repository
      # are still encrypted to the right readers (decision 002).
      - bin/check-recipients
      - task: omni-key
        vars: { RENEW: '{{.RENEW}}' }
      - task: kube-admin
        vars: { RENEW: '{{.RENEW}}' }
      - task: kube-readers
        vars: { RENEW: '{{.RENEW}}' }
      - task: talos
        vars: { RENEW: '{{.RENEW}}' }
      - task: openstack
        vars: { RENEW: '{{.RENEW}}' }
      - task: zitadel-key
        vars: { RENEW: '{{.RENEW}}' }

  login:		{ cmds: [bin/login] }
  due:			{ cmds: [bin/due] }
  omni-key:		{ cmds: [bin/omni-key],		env: { RENEW: '{{.RENEW}}' } }
  kube-admin:		{ cmds: [bin/kube-admin],	env: { RENEW: '{{.RENEW}}' } }
  kube-readers:		{ cmds: [bin/kube-readers],	env: { RENEW: '{{.RENEW}}' } }
  talos:		{ cmds: [bin/talos],		env: { RENEW: '{{.RENEW}}' } }
  zitadel-key:		{ cmds: [bin/zitadel-key],	env: { RENEW: '{{.RENEW}}' } }
  omni-operator-key:	{ cmds: [bin/omni-operator-key],	env: { RENEW: '{{.RENEW}}' } }
  zitadel-operator-key:	{ cmds: [bin/zitadel-operator-key],	env: { RENEW: '{{.RENEW}}' } }

  openstack:
    cmds: [bin/with-secrets OS_PASSWORD -- bin/openstack]
    env:  { RENEW: '{{.RENEW}}' }

  # The account password for a zone is one value in the operator store, in
  # vaults/operator/nordhost/<zone, dots as _>.enc.json, unless
  # NORDHOST_PASSWORD_REF names another for a run of one zone.
  nordhost-key:
    vars:
      PASSWORD_REF: >-
        {{.NORDHOST_PASSWORD_REF | default
          (printf "sops://vaults/operator/nordhost/%s.enc.json" (.NORDHOST_ZONE | replace "." "_"))}}
    cmds:
      - >-
        NORDHOST_ZONE='{{.NORDHOST_ZONE}}' NORDHOST_PASSWORD_REF='{{.PASSWORD_REF}}'
        NORDHOST_DRY_RUN="${NORDHOST_DRY_RUN:-${DRY_RUN:-}}"
        bin/with-secrets NORDHOST_PASSWORD -- bin/nordhost-key
