# bin/check-recipients on every push: public keys only, no secret, no YubiKey (decisions 001, 002 and 016). yq is
# pinned by sha256. Runs on dataverket-runner (apps/forgejo-runners/README.md).
name: check
on:
  push:
jobs:
  recipients:
    runs-on: ubuntu-latest
    steps:
      # Resolved on the forge's own actions org (decision 022).
      - uses: actions/checkout@v4
      - name: Install yq
        run: |
          curl -sfL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
          echo "8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f  /usr/local/bin/yq" \
            | sha256sum -c -
          chmod +x /usr/local/bin/yq
      - name: Check recipients
        run: bin/check-recipients
