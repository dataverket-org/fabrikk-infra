# Run by hand from the forge to test the runner: prints where it ran, touches nothing.
name: noop
on:
  workflow_dispatch:
jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Say where this ran
        run: |
          echo "runner: ${RUNNER_NAME:-unknown}"
          echo "host: $(hostname) $(uname -m)"
          echo "user: $(id -un)"
