version: '3'

#
# Commands for this repository. One namespace per group, one file per
# namespace under taskfiles/. A task that needs conditionals, loops or
# computed variables becomes a script in bin/.
#

includes:
  admin: taskfiles/admin.yml
  decisions: taskfiles/decisions.yml

tasks:
  default:           { cmds: [{ task: help }] }
  help:              { desc: "This list",                                    cmds: [task --list], silent: true }
  check-recipients:  { desc: "Every encrypted file matches its rule in .sops.yaml", cmds: [bin/check-recipients] }
  hooks:             { desc: "Run check-recipients before every commit, from .githooks",   cmds: [git config core.hooksPath .githooks] }
