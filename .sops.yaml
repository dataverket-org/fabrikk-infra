# Recipients for encrypted files in this repository. Public keys only; safe to commit.
#
# One key per decrypting process; neither store's key on the other store's files; a human copies between stores
# (decisions 001, 002, 016). A folder under vaults/ is operator-only unless a rule names its process.
# bin/check-recipients enforces it.
#
# - cluster-dataverket-prod  age1g3x9w...      Secret flux-system/sops-age, generated in-cluster 2026-09-17 by
#                                              bootstrap/sops-age-keygen.yaml; never leaves the cluster. Decrypts
#                                              the Flux files and nothing else.
# - swamp-fabrikk-infra-<host>                 ~/.config/sops/age/swamp-fabrikk-infra.txt on each swamp host, mode
#                                              0600, its own file so that sops from a terminal never loads it. One
#                                              key per host, generated there and never copied; the file name is the
#                                              same everywhere, since the vault config names it, and the entry here
#                                              ends in the host name. Decrypts the swamp vault unattended, never a cluster
#                                              file. A second swamp repository gets its own swamp-<repo> key.
#     -mio                 age15d64...         beddari's mio, since 2026-09-20, made with the vault
#     -jubilato            age13ekym...        beddari's laptop, since 2026-10-28
#     -linuss-macbook-air  age17g59f...        linus's laptop, since 2026-10-29
# - beddari                age1yubikey1q0d8... YubiKey serial 19668198 (PIN once, touch always)
# - linus                  age1yubikey1qwt...  YubiKey, since 2026-09-20
#
# The two operators are recipients of both stores, for recovery, re-keying and writes from a terminal.
#
# vaults/operator/: the two operators alone (decision 016).
#
# Only data/stringData are encrypted in the Flux files. The swamp vault carries its recipients in its own config and
# ignores this file; the second rule keeps `sops` from a terminal on the same set. sops ignores `identities`.
identities:
  cluster-dataverket-prod: &cluster_dataverket_prod age1g3x9w6x6wvskhtgn33wufdp2yn7vy8u3lf0f29r8nnkxuwrca4pscvydqy
  swamp-fabrikk-infra-mio: &swamp_fabrikk_infra_mio age15d64a0gasc74qak0pep0d33ff34rx4uk6uamutqfnddqe3kehcms90n22v
  swamp-fabrikk-infra-jubilato: &swamp_fabrikk_infra_jubilato age13ekym2x2qcelhvf6p6trs4h9e5u4v8z3hsrxpp3e5jchl7dxtp2q5qu0tn
  swamp-fabrikk-infra-linuss-macbook-air: &swamp_fabrikk_infra_linuss_macbook_air age17g59fkctkr4um3lwkflt8vd94hakawx6sf22ylxlayrnel0xg9zsakccqz
  beddari: &beddari age1yubikey1q0d8krn6cy32uun9ygwvrd373sp04hnjfpdfazy9lhpz70h3hauf2kgjzmx
  linus: &linus age1yubikey1qwtampyck0fvqdlcfwjk3yhcu2s3gvrn67wdvxyv8uty6v5zpkxq76kzrpw

creation_rules:
  # vaults/operator/ first: sops takes the first match.
  - path_regex: ^vaults/operator/.*\.enc\.(ya?ml|json)$
    key_groups:
      - age:
          - *beddari
          - *linus
  - path_regex: ^(artifacts|apps|infrastructure)/.*\.enc\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age:
          - *cluster_dataverket_prod
          - *beddari
          - *linus
  # vaults/infra/: the swamp vault, read unattended by the swamp host's key.
  - path_regex: vaults/infra/.*\.enc\.json(\.plain\.tmp)?$
    key_groups:
      - age:
          - *swamp_fabrikk_infra_mio
          - *swamp_fabrikk_infra_jubilato
          - *swamp_fabrikk_infra_linuss_macbook_air
          - *beddari
          - *linus
  # Every other folder under vaults/: the operators alone, until a rule above names a process (decision 016).
  - path_regex: vaults/.*\.enc\.(ya?ml|json)(\.plain\.tmp)?$
    key_groups:
      - age:
          - *beddari
          - *linus
