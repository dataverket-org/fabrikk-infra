apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Handover: www moves to an OCI artifact with its own Kustomization (artifacts/www). Until then the apps Kustomization
# must let go of these objects without pruning them, or the namespace goes with them. Removed with the move.
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
resources:
  - ./namespace.yaml
  - ./www-secrets.enc.yaml
  - ./nginx-conf.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./httproute.yaml
