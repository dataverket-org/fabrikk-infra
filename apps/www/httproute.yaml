apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www
  namespace: www
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-system
      sectionName: https
  # Covered by the wildcard certificate; external-dns makes the record from this route.
  hostnames:
    - "signal.dataverket.org"
  rules:
    - backendRefs:
        - name: www
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www-redirect
  namespace: www
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-system
      sectionName: http
  hostnames:
    - "signal.dataverket.org"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
