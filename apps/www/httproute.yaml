apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www
  namespace: www
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-system
      sectionName: https
  # The wildcard certificate on the gateway's https listener already covers this name, and external-dns creates the
  # record from this route (its gateway-httproute source). Add the website's names here when it arrives.
  hostnames:
    - "signal.dataverket.org"
  rules:
    - backendRefs:
        - name: www
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www-redirect
  namespace: www
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-system
      sectionName: http
  hostnames:
    - "signal.dataverket.org"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
