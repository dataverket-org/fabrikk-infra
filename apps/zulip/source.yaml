# Zulip is delivered gitless, as zot is (README "Gitless delivery", decision 013; artifacts/zulip/README.md).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: zulip-config
  namespace: flux-system
spec:
  interval: 10m
  url: oci://zot.zot.svc.cluster.local:5000/platform/zulip-config
  insecure: true
  ref:
    tag: current
  # Set, this replaces source-controller's default ignore list, which drops *.png and with it the brand
  # (artifacts/zulip/brand/), the files the ConfigMap zulip-brand is generated from.
  ignore: |
    .git/
  # Verification, switched on after this artifact has been pushed signed once with the site key
  # (vaults/operator/README.md, "Signing keys"; clusters/production/cosign-osl1.yaml holds the public half):
  # verify:
  #   provider: cosign
  #   secretRef:
  #     name: cosign-osl1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zulip
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: infrastructure
    - name: zot
  sourceRef:
    kind: OCIRepository
    name: zulip-config
  path: ./
  prune: true
  wait: true
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
