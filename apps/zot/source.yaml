# zot is delivered gitless: git holds only this pointer, the manifests travel as an OCI artifact (artifacts/zot,
# pushed by artifacts/zot/push.sh) that zot hosts itself. Before zot exists, and if a bad artifact ever breaks it,
# bootstrap/zot-from-git.yaml applies the same directory from git; nothing outside this cluster and this repository
# is needed to bring the registry back.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: zot-config
  namespace: flux-system
spec:
  interval: 10m
  url: oci://registry.dataverket.org/platform/zot-config
  ref:
    tag: current
  # TODO verify.provider: cosign with the platform signing key once it exists; until then only fabrikk-ci can push.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zot
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: OCIRepository
    name: zot-config
  path: ./
  prune: true
  wait: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
