# zot is delivered gitless (README "Gitless delivery", decisions 011 and 013). Fetched through the Service, plain HTTP.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: zot-config
  namespace: flux-system
spec:
  interval: 10m
  url: oci://zot.zot.svc.cluster.local:5000/platform/zot-config
  insecure: true
  ref:
    tag: current
  # Verification, switched on after this artifact has been pushed signed once with the site key
  # (vaults/operator/README.md, "Signing keys"; clusters/production/cosign-osl1.yaml holds the public half):
  # verify:
  #   provider: cosign
  #   secretRef:
  #     name: cosign-osl1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zot
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: OCIRepository
    name: zot-config
  path: ./
  prune: true
  wait: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
