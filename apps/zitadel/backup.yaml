# Backups of zitadel-db to the hov1 site (backup/README.md): base backups daily, WAL continuously, 14 days of both,
# through the Barman Cloud plugin. The account Secret s3-cnpg-zitadel is sops-encrypted; hov1-s3 carries the endpoint,
# the region and the site's CA root in clear. The serverName is the folder inside the bucket; a cluster restored
# from this archive must use a new one.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: hov1
  namespace: zitadel
spec:
  retentionPolicy: 14d
  configuration:
    destinationPath: s3://cnpg-zitadel/
    endpointURL: https://213.128.185.82:443
    endpointCA:
      name: hov1-s3
      key: ca.crt
    s3Credentials:
      accessKeyId:
        name: s3-cnpg-zitadel
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: s3-cnpg-zitadel
        key: SECRET_ACCESS_KEY
      region:
        name: hov1-s3
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
---
# Daily base backup. CNPG's schedule has six fields, seconds first. immediate: the first base backup runs as soon
# as this is applied, so the archive is restorable from day one and not from the first 03:00 after.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: zitadel-db-daily
  namespace: zitadel
spec:
  schedule: "0 30 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: zitadel-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
# The first base backup, taken on 2026-09-20 right after the plugin rollout: the ScheduledBackup's immediate run had
# fired while the instances were still being recreated and failed. A completed Backup is inert; this stays as the
# record of when the archive became restorable.
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: zitadel-db-first
  namespace: zitadel
spec:
  cluster:
    name: zitadel-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
