apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: zitadel
spec:
  interval: 1h
  chart:
    spec:
      chart: zitadel
      version: "10.0.4"
      sourceRef:
        kind: HelmRepository
        name: zitadel-repo
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    zitadel:
      configmapConfig:
        ExternalDomain: zitadel.dataverket.org
        ExternalSecure: true
        FirstInstance:
          Org:
            Human:
              UserName: "admin"
              Email: "admin@dataverket.org"
              Password: "nixdev-ziPrip-2tommo"
              PasswordChangeRequired: true
      masterkeySecretName: zitadel-masterkey
    env:
      - name: ZITADEL_DATABASE_POSTGRES_DSN
        valueFrom:
          secretKeyRef:
            name: zitadel-db-app
            key: uri
