# Zitadel, delivered gitless from artifacts/zitadel (decisions 013, 028; the gitless plan, goal 2). The artifact
# carries the HelmRelease itself, the plan's exception; its chart comes from zot too.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: zitadel-config
  namespace: flux-system
spec:
  interval: 10m
  url: oci://zot.zot.svc.cluster.local:5000/platform/zitadel-config
  insecure: true
  ref:
    tag: current
  # Verification, switched on in goal 3 of the gitless plan, once every artifact is pushed signed:
  # verify:
  #   provider: cosign
  #   secretRef:
  #     name: cosign-osl1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zitadel
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: zot
    # The database Cluster needs the operator's CRDs.
    - name: cnpg
  sourceRef:
    kind: OCIRepository
    name: zitadel-config
  path: ./
  prune: true
  wait: true
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
