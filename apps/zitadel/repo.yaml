# Zitadel's chart from zot (docs/plans/2026-11-gitless.md, goal 1): the pinned chart is pushed once into
# mirror/charts.zitadel.com with `helm push` and the cluster reads it by zot's Service name, so a chart fetch
# needs nothing from charts.zitadel.com or GitHub, where that index points. Plain HTTP inside the cluster, as every
# OCIRepository here (decision 013). Zitadel stays a HelmRelease: its init and setup Jobs are Helm hooks.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: zitadel-repo
  namespace: flux-system
spec:
  type: oci
  url: oci://zot.zot.svc.cluster.local:5000/mirror/charts.zitadel.com
  insecure: true
  interval: 1h
