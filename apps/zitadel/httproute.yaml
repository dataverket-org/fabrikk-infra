apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel
  namespace: zitadel
spec:
  # The names of one instance while it moves (docs/plans/2026-11-zitadel-auth-osl1.md, step 5): each attaches
  # to the listener whose hostname it matches, the two dataverket.org names to the wildcard listener; external-dns
  # makes the records from this route. id.dataverket.org is the name people bind to and id.osl1.dvkt.no this
  # site's alias (decision 031); zitadel.dataverket.org retires with goal G.
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-system
      sectionName: https
    - name: envoy-gateway
      namespace: envoy-system
      sectionName: https-id-osl1
  hostnames:
    - "zitadel.dataverket.org"
    - "id.dataverket.org"
    - "id.osl1.dvkt.no"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ui/v2/login
      backendRefs:
        - name: zitadel-login
          port: 3000
    - backendRefs:
        - name: zitadel
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel-redirect
  namespace: zitadel
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-system
      sectionName: http
  hostnames:
    - "zitadel.dataverket.org"
    - "id.dataverket.org"
    - "id.osl1.dvkt.no"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

