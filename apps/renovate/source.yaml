# Renovate, delivered gitless from artifacts/renovate, rendered in the factory (decisions 013, 028), and fetched
# through the zot Service, plain HTTP (decision 013).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: renovate-config
  namespace: flux-system
spec:
  interval: 10m
  url: oci://zot.zot.svc.cluster.local:5000/platform/renovate-config
  insecure: true
  ref:
    tag: current
  # Verification, switched on in goal 3 of the gitless plan, once every artifact is pushed signed:
  # verify:
  #   provider: cosign
  #   secretRef:
  #     name: cosign-osl1
---
# The bootstrap Job execs into the forge, so the forge comes first. Decryption is for renovate-github.enc.yaml,
# when a person adds it (docs/runbooks/renovate-bring-up.md).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: zot
    - name: forgejo
  sourceRef:
    kind: OCIRepository
    name: renovate-config
  path: ./
  prune: true
  wait: true
  timeout: 15m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
