# The runner's docker store, a raw Block disk (README.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: org-dataverket-runner-docker-store
  namespace: forgejo-runners
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Block
  storageClassName: csi-cinder-sc-delete
  resources:
    requests:
      storage: 20Gi
