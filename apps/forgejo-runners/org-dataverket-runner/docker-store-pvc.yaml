# The runner's docker store, mounted at dind's /var/lib/docker (README.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: org-dataverket-runner-docker
  namespace: forgejo-runners
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: csi-cinder-sc-delete
  resources:
    requests:
      storage: 20Gi
