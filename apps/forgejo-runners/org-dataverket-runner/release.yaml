apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: org-dataverket-runner
  namespace: forgejo-runners
spec:
  interval: 1h
  releaseName: org-dataverket-runner
  targetNamespace: forgejo-runners
  chart:
    spec:
      chart: .
      sourceRef:
        kind: GitRepository
        name: forgejo-runner-helm
        namespace: flux-system
  values:
    dind:
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          memory: 4Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
    runner:
      config:
        instance: https://git.dataverket.org
        existingSecret: org-dataverket-runner-secret
    # dind's default /var/lib/docker sits directly on the Kata guest's own
    # rootfs. Give it its own emptyDir instead - not memory-backed, since
    # tmpfs usage counts against dind's memory limit above and
    # catthehacker/ubuntu:act-latest is a large image.
    volumes:
      - name: docker-lib
        emptyDir: {}
    volumeMounts:
      - name: docker-lib
        mountPath: /var/lib/docker
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: org-dataverket-runner-forgejo-runner
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: org-dataverket-runner-forgejo-runner
              spec:
                template:
                  spec:
                    runtimeClassName: kata
