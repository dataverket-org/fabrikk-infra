apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: org-dataverket-runner
  namespace: forgejo-runners
spec:
  interval: 1h
  releaseName: org-dataverket-runner
  targetNamespace: forgejo-runners
  chart:
    spec:
      chart: .
      sourceRef:
        kind: GitRepository
        name: forgejo-runner-helm
        namespace: flux-system
  values:
    # Every volume in a Kata guest is a virtiofs share, and Talos starts virtiofsd
    # without --xattr (its configuration.toml: virtio_fs_extra_args =
    # ["--thread-pool-size=1", "--announce-submounts"]). Without xattrs, docker
    # cannot register image layers that carry file capabilities
    # (lsetxattr security.capability: operation not supported), so every job
    # failed while pulling its image. Talos allows virtio_fs_extra_args as a pod
    # annotation (enable_annotations); the value is a JSON array appended to the
    # defaults. Verified 2026-09-18 with a test pod: user.* and
    # security.capability xattrs stick on the Cinder volume with this set.
    podAnnotations:
      io.katacontainers.config.hypervisor.virtio_fs_extra_args: '["--xattr"]'
    dind:
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          # Kata sizes the guest from limits: default_vcpus (1) + cpu limits,
          # default_memory (2Gi) + memory limits. Without a cpu limit the VM
          # had one vCPU.
          cpu: "1"
          memory: 4Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
    runner:
      config:
        instance: https://git.dataverket.org
        existingSecret: org-dataverket-runner-secret
    # dind's default /var/lib/docker sits directly on the Kata guest's own
    # ephemeral rootfs, which gets wiped on every pod restart - meaning
    # every crash forced a full re-pull of the multi-GB
    # catthehacker/ubuntu:act-latest image, likely failing outright if the
    # guest's ephemeral disk was too small to hold it. A Cinder-backed PVC
    # (docker-lib-pvc.yaml) survives restarts and gives dind a real block
    # device instead.
    volumes:
      - name: docker-lib
        persistentVolumeClaim:
          claimName: org-dataverket-runner-docker-lib
    volumeMounts:
      - name: docker-lib
        mountPath: /var/lib/docker
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: org-dataverket-runner-forgejo-runner
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: org-dataverket-runner-forgejo-runner
              spec:
                template:
                  spec:
                    runtimeClassName: kata
                    containers:
                      # overlay2 needs trusted.overlay.* xattrs, which virtiofsd
                      # cannot set on the host without CAP_SYS_ADMIN (it keeps
                      # only CAP_SETFCAP and friends), so overlay2 fails with
                      # EINVAL (seen before --xattr; not retested with it). vfs
                      # needs none of that, just slower (no layer CoW sharing).
                      - name: dind
                        args:
                          - --storage-driver=vfs
