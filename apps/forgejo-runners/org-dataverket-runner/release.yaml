apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: org-dataverket-runner
  namespace: forgejo-runners
spec:
  interval: 1h
  releaseName: org-dataverket-runner
  targetNamespace: forgejo-runners
  chart:
    spec:
      chart: .
      sourceRef:
        kind: GitRepository
        name: forgejo-runner-helm
        namespace: flux-system
  values:
    dind:
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          # Kata sizes the guest from the limits (README.md).
          cpu: "1"
          memory: 4Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
    runner:
      config:
        instance: https://git.dataverket.org
        existingSecret: org-dataverket-runner-secret
    # The docker store, a raw Block disk handed to dind as a device in the patch below (README.md).
    volumes:
      - name: docker-store
        persistentVolumeClaim:
          claimName: org-dataverket-runner-docker-store
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: org-dataverket-runner-forgejo-runner
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: org-dataverket-runner-forgejo-runner
              spec:
                # One ReadWriteOnce disk: the old pod stops before the new one starts (README.md).
                strategy:
                  type: RollingUpdate
                  rollingUpdate:
                    maxSurge: 0
                    maxUnavailable: 1
                template:
                  spec:
                    runtimeClassName: kata
                    containers:
                      - name: dind
                        # Format once, when blank; mount afterwards (README.md).
                        command: ["sh", "-ec"]
                        args:
                          - |
                            dev=/dev/docker-store
                            if ! blkid "$dev" | grep -q 'TYPE='; then
                              echo "formatting $dev (blank disk)"
                              mkfs.ext4 -q -F "$dev"
                            fi
                            mkdir -p /var/lib/docker
                            mount -o noatime "$dev" /var/lib/docker
                            exec dockerd-entrypoint.sh --storage-driver=overlay2
                        volumeDevices:
                          - name: docker-store
                            devicePath: /dev/docker-store
