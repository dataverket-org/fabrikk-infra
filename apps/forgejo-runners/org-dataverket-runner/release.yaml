apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: org-dataverket-runner
  namespace: forgejo-runners
spec:
  interval: 1h
  releaseName: org-dataverket-runner
  targetNamespace: forgejo-runners
  chart:
    spec:
      chart: .
      sourceRef:
        kind: GitRepository
        name: forgejo-runner-helm
        namespace: flux-system
  values:
    runner:
      config:
        instance: https://git.dataverket.org
        existingSecret: org-dataverket-runner-secret
    # Running under runtimeClassName: kata means the dind sidecar's writable
    # layer sits on the Kata guest's virtiofs-backed rootfs, which can't
    # host a nested overlay2 mount (dockerd fails with "invalid argument"
    # even with index=off). Give it a tmpfs-backed /var/lib/docker instead
    # so overlay2 has a filesystem that actually supports nesting.
    volumes:
      - name: docker-lib
        emptyDir:
          medium: Memory
    volumeMounts:
      - name: docker-lib
        mountPath: /var/lib/docker
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: org-dataverket-runner-forgejo-runner
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: org-dataverket-runner-forgejo-runner
              spec:
                template:
                  spec:
                    runtimeClassName: kata
