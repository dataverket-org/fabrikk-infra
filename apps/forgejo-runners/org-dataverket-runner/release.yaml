apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: org-dataverket-runner
  namespace: forgejo-runners
spec:
  interval: 1h
  releaseName: org-dataverket-runner
  targetNamespace: forgejo-runners
  chart:
    spec:
      chart: .
      sourceRef:
        kind: GitRepository
        name: forgejo-runner-helm
        namespace: flux-system
  values:
    dind:
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          memory: 4Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
    runner:
      config:
        instance: https://git.dataverket.org
        existingSecret: org-dataverket-runner-secret
    # dind's default /var/lib/docker sits directly on the Kata guest's own
    # ephemeral rootfs, which gets wiped on every pod restart - meaning
    # every crash forced a full re-pull of the multi-GB
    # catthehacker/ubuntu:act-latest image, likely failing outright if the
    # guest's ephemeral disk was too small to hold it. A Cinder-backed PVC
    # (docker-lib-pvc.yaml) survives restarts and gives dind a real block
    # device instead.
    volumes:
      - name: docker-lib
        persistentVolumeClaim:
          claimName: org-dataverket-runner-docker-lib
    volumeMounts:
      - name: docker-lib
        mountPath: /var/lib/docker
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: org-dataverket-runner-forgejo-runner
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: org-dataverket-runner-forgejo-runner
              spec:
                template:
                  spec:
                    runtimeClassName: kata
