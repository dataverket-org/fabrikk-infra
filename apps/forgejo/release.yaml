apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 1h
  releaseName: forgejo
  targetNamespace: forgejo
  chartRef:
    kind: OCIRepository
    name: forgejo-helm
    namespace: flux-system
  values:
    gitea:
      persistence:
        enabled: true
      admin:
        existingSecret: forgejo-admin
      oauth:
        - name: Zitadel
          provider: "openidConnect"
          autoDiscoverUrl: "https://zitadel.dataverket.org/.well-known/openid-configuration"
          existingSecret: forgejo-zitadel-oauth-secret
      config:
        # Actions resolve on this forge's own actions org (decision 022, README.md).
        actions:
          DEFAULT_ACTIONS_URL: self
        database:
          DB_TYPE: postgres
          HOST: forgejo-postgres-rw:5432
          NAME: forgejo
          USER: forgejo
        mailer:
          enabled: true
          from: noreply@dataverket.org
          protocol: smtps
          smtp_addr: mail.nordhost.no
          smtp_port: 465
        service:
          ENABLE_INTERNAL_SIGNIN: false
          ENABLE_BASIC_AUTHENTICATION: false
          DISABLE_REGISTRATION: false
          SHOW_REGISTRATION_BUTTON: false
          ENABLE_NOTIFY_MAIL: true
        ui:
          DEFAULT_THEME: dataverket-auto
          THEMES: dataverket-auto,dataverket-light,dataverket-dark
      additionalConfigFromEnvs:
        - name: FORGEJO__DATABASE__PASSWD
          valueFrom:
            secretKeyRef:
              name: forgejo-postgres-app
              key: password
        - name: FORGEJO__MAILER__USER
          valueFrom:
            secretKeyRef:
              name: forgejo-mailer
              key: username
        - name: FORGEJO__MAILER__PASSWD
          valueFrom:
            secretKeyRef:
              name: forgejo-mailer
              key: password
        # Pinned so a restore onto an empty volume can read the database (README.md, backup/README.md).
        - name: FORGEJO__SECURITY__SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: forgejo-security
              key: SECRET_KEY
        - name: FORGEJO__SECURITY__INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: forgejo-security
              key: INTERNAL_TOKEN
        - name: FORGEJO__OAUTH2__JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: forgejo-security
              key: JWT_SECRET
        - name: FORGEJO__SERVER__LFS_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: forgejo-security
              key: LFS_JWT_SECRET
    # The theme's ConfigMaps over Forgejo's custom paths (README.md).
    extraVolumes:
      - name: theme-css
        configMap:
          name: forgejo-theme-css
      - name: theme-img
        configMap:
          name: forgejo-theme-img
      - name: theme-fonts
        configMap:
          name: forgejo-theme-fonts
      - name: theme-locale
        configMap:
          name: forgejo-theme-locale
    extraContainerVolumeMounts:
      - name: theme-css
        mountPath: /data/gitea/public/assets/css
      - name: theme-img
        mountPath: /data/gitea/public/assets/img
      - name: theme-fonts
        mountPath: /data/gitea/public/assets/fonts
      - name: theme-locale
        mountPath: /data/gitea/options/locale
    tcpRoute:
      enabled: true
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-system
          sectionName: ssh
      hostnames:
        - git.dataverket.org
      port: 22
    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-system
          sectionName: https
      hostnames:
        - git.dataverket.org
      port: 3000
