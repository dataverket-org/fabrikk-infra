# The landing page's copy, regenerated in place by a CronJob from the running Forgejo binary (README.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-theme-locale
  namespace: forgejo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-theme-locale
  namespace: forgejo
rules:
  # create cannot be limited by name.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["forgejo-theme-locale"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-theme-locale
  namespace: forgejo
subjects:
  - kind: ServiceAccount
    name: forgejo-theme-locale
    namespace: forgejo
roleRef:
  kind: Role
  name: forgejo-theme-locale
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-theme-locale
  namespace: forgejo
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: forgejo-theme-locale
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 0
          containers:
            - name: extract-and-patch
              # Must equal Forgejo's running app version (README.md).
              image: code.forgejo.org/forgejo/forgejo:15.0.7-rootless
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  apk add --no-cache python3 curl >/dev/null
                  curl -fsSLo /usr/local/bin/kubectl \
                    "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
                  chmod +x /usr/local/bin/kubectl

                  curl -fsSLo /tmp/make_theme.py \
                    https://git.dataverket.org/dataverket/forgejo-theme/raw/branch/main/make-theme.py
                  python3 <<'PY'
                  import sys
                  sys.path.insert(0, '/tmp')
                  import make_theme
                  make_theme.locale('/usr/local/bin/forgejo')
                  PY

                  kubectl create configmap forgejo-theme-locale \
                    --namespace forgejo \
                    --from-file=/tmp/options/locale/locale_en-US.ini \
                    --dry-run=client -o yaml \
                  | kubectl apply -f -
