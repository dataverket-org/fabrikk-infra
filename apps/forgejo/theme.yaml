# The Dataverket Forgejo theme (git.dataverket.org/dataverket/forgejo-theme),
# tracked independently of the forgejo-helm chart itself. Public repo, same
# reason flux-system's own GitRepository skips a secretRef (see
# clusters/production/flux-system/gotk-sync.yaml): Flux only reads it.
#
# The repo's own kustomization.yaml turns its committed public/assets/* into
# three ConfigMaps (forgejo-theme-css/-img/-fonts), which release.yaml mounts
# over Forgejo's own public/assets/{css,img,fonts}. Push to forgejo-theme's
# main, and within one reconcile the running pod serves the new files - no
# rebuild, no restart, nothing to apply by hand.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: forgejo-theme
  namespace: forgejo
spec:
  interval: 5m
  url: https://git.dataverket.org/dataverket/forgejo-theme.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-theme
  namespace: forgejo
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: forgejo-theme
  path: ./
  prune: true
  targetNamespace: forgejo
