# The Dataverket theme: a GitRepository and its own kustomization, three ConfigMaps release.yaml mounts (README.md).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: forgejo-theme
  namespace: forgejo
spec:
  # Suspended while the theme moves to artifacts/forgejo-theme/; removed with it.
  suspend: true
  interval: 5m
  url: https://git.dataverket.org/dataverket/forgejo-theme.git
  ref:
    branch: main
  # Flux leaves *.png out of an artifact by default, and the PNGs are the favicon, logo and touch icon. A set ignore
  # replaces that default list, so this ships what the repository's kustomization.yaml reads and nothing else.
  ignore: |
    /*
    !/kustomization.yaml
    !/public/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-theme
  namespace: forgejo
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: forgejo-theme
  path: ./
  # Off, so removing this Kustomization leaves the ConfigMaps for the artifact's Kustomization to take over.
  prune: false
  suspend: true
  targetNamespace: forgejo
