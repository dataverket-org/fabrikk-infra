# The Dataverket theme: a GitRepository and its own kustomization, three ConfigMaps release.yaml mounts (README.md).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: forgejo-theme
  namespace: forgejo
spec:
  interval: 5m
  url: https://git.dataverket.org/dataverket/forgejo-theme.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-theme
  namespace: forgejo
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: forgejo-theme
  path: ./
  prune: true
  targetNamespace: forgejo
