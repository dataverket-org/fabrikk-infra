# The Dataverket theme is delivered gitless, rendered in the factory from artifacts/forgejo-theme/ (decision 028):
# four ConfigMaps release.yaml mounts (README.md, "The theme"). Fetched through the Service, plain HTTP (decision 013).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: forgejo-theme-config
  namespace: flux-system
spec:
  interval: 10m
  url: oci://zot.zot.svc.cluster.local:5000/platform/forgejo-theme-config
  insecure: true
  ref:
    tag: current
  # Verification, switched on after this artifact has been pushed signed once with the site key
  # (vaults/operator/README.md, "Signing keys"; clusters/production/cosign-osl1.yaml holds the public half):
  # verify:
  #   provider: cosign
  #   secretRef:
  #     name: cosign-osl1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-theme
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: zot
  sourceRef:
    kind: OCIRepository
    name: forgejo-theme-config
  path: ./
  prune: true
  wait: true
  timeout: 5m
