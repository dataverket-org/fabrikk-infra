apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-postgres
  namespace: forgejo
spec:
  # One instance on one Cinder volume: Cinder keeps three copies, and a failover is a volume reattach (storage plan,
  # building block 1). No PodDisruptionBudget, so a drain moves it instead of blocking on it.
  instances: 1
  enablePDB: false
  # Recovery needs the archive's Postgres major; the same image the cluster ran before.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  storage:
    storageClass: csi-cinder-sc-delete
    size: 10Gi
  postgresql:
    parameters:
      max_wal_size: 1GB
  # WAL archiving and base backups to the hov1 site through the Barman Cloud plugin (backup.yaml). Each cluster
  # restored from an archive writes its own: forgejo-postgres-2 is the one created on the storage plan's step 2.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: hov1
        serverName: forgejo-postgres-2
  # Created from the hov1 archive, and a rebuild from git is too. CNPG reads bootstrap and externalClusters only when
  # it creates the cluster. The source moves to the archive this cluster writes the day its first base backup
  # completes; a rebuild then moves serverName above to the next number first (storage plan, "Rebuild from git").
  bootstrap:
    recovery:
      source: hov1-archive
      database: forgejo
      owner: forgejo
  externalClusters:
    - name: hov1-archive
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: hov1
          serverName: forgejo-postgres
