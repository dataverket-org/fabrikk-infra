apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-postgres
  namespace: forgejo
spec:
  instances: 3
  storage:
    size: 64Gi
  # WAL archiving and base backups to the hov1 site through the Barman Cloud plugin (backup.yaml). Adding this
  # gives every instance a plugin sidecar, which is a rolling restart and one primary switchover.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: hov1
        serverName: forgejo-postgres
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
