apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - repo.yaml
  - postgres.yaml
  - hov1-s3.yaml
  - s3-cnpg-forgejo.enc.yaml
  - backup.yaml
  - forgejo-security.enc.yaml
  - release.yaml
  - actions-mirror.yaml
# The avatar of the actions org, the Forgejo logo, mounted into the mirror CronJob, which sets it on the org.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: actions-org-avatar
    namespace: forgejo
    files:
      - avatar.png=actions-org-avatar.png
