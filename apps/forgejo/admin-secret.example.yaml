# Not applied by Flux (deliberately excluded from kustomization.yaml).
#
# Forgejo needs a Secret named "forgejo-admin" in the "forgejo" namespace
# with "username" and "password" keys to bootstrap the admin user (see
# gitea.admin.existingSecret in release.yaml). Fill in real values below
# and apply it out-of-band, e.g.:
#
#   kubectl apply -f admin-secret.example.yaml
#
# or generate it from real values without ever writing plaintext to disk:
#
#   kubectl -n forgejo create secret generic forgejo-admin \
#     --from-literal=username=CHANGEME \
#     --from-literal=password=CHANGEME
#
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-admin
  namespace: forgejo
type: Opaque
stringData:
  username: CHANGEME
  password: CHANGEME
