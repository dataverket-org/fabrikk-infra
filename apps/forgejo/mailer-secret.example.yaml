# Not applied by Flux (deliberately excluded from kustomization.yaml).
#
# Forgejo needs a Secret named "forgejo-mailer" in the "forgejo" namespace
# with "username" and "password" keys to authenticate against the SMTP
# server (see gitea.config.mailer / additionalConfigFromEnvs in
# release.yaml). Fill in real values below and apply it out-of-band, e.g.:
#
#   kubectl apply -f mailer-secret.example.yaml
#
# or generate it from real values without ever writing plaintext to disk:
#
#   kubectl -n forgejo create secret generic forgejo-mailer \
#     --from-literal=username=CHANGEME \
#     --from-literal=password=CHANGEME
#
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-mailer
  namespace: forgejo
type: Opaque
stringData:
  username: CHANGEME
  password: CHANGEME
