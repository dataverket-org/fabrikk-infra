# versitygw is delivered gitless, as zot is (README "Gitless delivery", decision 013; artifacts/versitygw/README.md).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: versitygw-config
  namespace: flux-system
spec:
  interval: 10m
  url: oci://zot.zot.svc.cluster.local:5000/platform/versitygw-config
  insecure: true
  ref:
    tag: current
  # TODO verify.provider: cosign with the platform signing key once it exists; until then only fabrikk-ci can push.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: versitygw
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: infrastructure
    - name: zot
  sourceRef:
    kind: OCIRepository
    name: versitygw-config
  path: ./
  prune: true
  wait: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
